# CI lint gate. Deliberately narrow: pyflakes (unused/undefined names,
# duplicate definitions) and syntax errors -- the classes that hide real bugs,
# such as a test defined twice so the first copy never runs. Widen it once the
# wider rule sets (B, UP, SIM) have been cleaned up.
target-version = "py311"
extend-exclude = [
    # Stage-4B research is under active development on its own branches.
    "agent",
    "scripts/stage4b_*.py",
    "tests/test_agent_*.py",
]

[lint]
select = ["F", "E9"]
