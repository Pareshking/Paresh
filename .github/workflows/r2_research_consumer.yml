name: R2 Research Consumer Validation

on:
  pull_request:
    paths:
      - "r2/consumers/**"
      - "src/storage/**"
      - "tests/test_r2_research_consumer.py"
      - ".github/workflows/r2_research_consumer.yml"
  push:
    branches:
      - main
    paths:
      - "r2/consumers/**"
      - "src/storage/**"
      - "tests/test_r2_research_consumer.py"
      - ".github/workflows/r2_research_consumer.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  r2-research-consumer:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: R2 research consumer tests
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/test_r2_research_consumer.py tests/test_r2_reader.py
