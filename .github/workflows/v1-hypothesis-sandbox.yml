name: V1 Hypothesis Sandbox

on:
  workflow_dispatch:
  push:
    branches: [Sandbox]

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run V1 hypothesis research
        env:
          PYTHONPATH: .
        run: python research/v1_hypothesis_backtest.py
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: v1-hypothesis-results
          path: research/outputs/
          retention-days: 14
