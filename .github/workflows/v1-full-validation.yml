name: V1 Full Validation

on:
  push:
    branches: [main]
    paths-ignore:
      - 'src/storage/**'
      - 'r2/consumers/**'
      - 'r2/raw/**'
      - 'scripts/r2_*.py'
      - 'scripts/build_trading_sessions.py'
      - 'scripts/build_market_cap_history.py'
      - 'tests/test_r2_*.py'
      - 'tests/test_build_trading_sessions.py'
      - 'tests/test_market_cap_history.py'
      - '.github/workflows/r2-*.yml'
      - '.github/workflows/r2_*.yml'
      - 'docs/R2_*.md'
      - 'docs/MARKET_DATA_ARCHIVE_R2_SPEC.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'r2/raw/**'
      - 'src/storage/**'
      - 'r2/consumers/**'
      - 'scripts/r2_*.py'
      - 'scripts/build_trading_sessions.py'
      - 'scripts/build_market_cap_history.py'
      - 'tests/test_r2_*.py'
      - 'tests/test_build_trading_sessions.py'
      - 'tests/test_market_cap_history.py'
      - '.github/workflows/r2-*.yml'
      - '.github/workflows/r2_*.yml'
      - 'docs/R2_*.md'
      - 'docs/MARKET_DATA_ARCHIVE_R2_SPEC.md'
  workflow_dispatch:
  # Daily on main, after the night's syncs (audit A6, 7 Nov 2026). The syncs commit
  # data/ with [skip ci], so a data change that breaks a data test turned nothing
  # red: the 752-name Nifty 750 (S86) sat on main for four days unseen. A failure
  # here reaches the scheduled-failure issue.
  schedule:
    - cron: "23 23 * * *"

permissions:
  contents: read
# Superseded PR runs are cancelled: only the PR's current head counts (S141,
# 16 Nov 2026: 61 full-validation PR runs, 242 min, were still running when a
# newer push reached their branch). Pushes, schedules and chains are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    env:
      PYTHONPATH: .
    # Feature-branch pushes are never the V1 deployment/validation target.
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          # A PR's merge commit and its base: enough for the scope step below.
          fetch-depth: 2
      # S199 (owner, 22-23 Nov 2026): a PR that changes only Markdown runs the tests that
      # read Markdown, not the ~14-min suite and app checks. Ruff runs in lint.yml for every
      # PR. A page requirements doc (docs/*_REQUIREMENTS.md) is read row by row against the
      # running app below, so a PR touching one keeps the full run. Push, schedule and
      # dispatch always run everything. The job keeps its name either way, so a required
      # `validate` check still reports.
      - name: Scope (Markdown-only PR?)
        id: scope
        run: |
          DOCS_ONLY=false
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            CHANGED=$(git diff --name-only HEAD^1 HEAD)
            echo "Changed files:"; echo "$CHANGED"
            if [ -n "$CHANGED" ] \
               && ! echo "$CHANGED" | grep -qv '\.md$' \
               && ! echo "$CHANGED" | grep -q '_REQUIREMENTS\.md$'; then
              DOCS_ONLY=true
            fi
          fi
          echo "docs_only=$DOCS_ONLY" >> "$GITHUB_OUTPUT"
          echo "DOCS_ONLY=$DOCS_ONLY"
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
      # pyyaml is a TEST-only dependency, deliberately not in requirements.txt:
      # the app never parses YAML. Without it here, tests/test_daily_sync_workflow.py
      # module-skips and the guards on the sync workflow -- the ones that catch a
      # step declaring both `uses` and `run`, which invalidated the file and cost
      # 200 consecutive runs -- silently do not run in the only place that matters.
      - run: pip install -r requirements.txt pytest pyyaml

      - name: Markdown-reading tests (Markdown-only PR)
        if: ${{ steps.scope.outputs.docs_only == 'true' }}
        run: python -m pytest -q tests/test_launch_slot_10_leftovers.py tests/test_ss_prices.py

      # Everything, R2 suites included. They are hermetic (fakes, no
      # credentials, ~2 s), and they also depend on code no R2 path filter
      # watches -- src/core/tickers.py, the membership builder, and above all
      # requirements.txt. Excluded here, a pandas or pyarrow bump ran them
      # nowhere. R2 Focused Validation still runs them for R2-only changes,
      # which this workflow's paths-ignore skips.
      # data/nse_prices/closes.parquet is not in git (TODO S178); the suite is offline,
      # so the tests that check the real closes read the published copy fetched here.
      - name: Fetch the published NSE closes
        if: ${{ steps.scope.outputs.docs_only != 'true' }}
        run: python scripts/fetch_nse_closes.py

      - name: Full regression suite
        if: ${{ steps.scope.outputs.docs_only != 'true' }}
        run: python -m pytest -q

      - name: Compile application and source
        if: ${{ steps.scope.outputs.docs_only != 'true' }}
        run: python -m compileall -q app.py src scripts

      - name: Enforce deprecated Streamlit HTML cleanup
        if: ${{ steps.scope.outputs.docs_only != 'true' }}
        run: |
          if git grep -n -E "components.v1|components.html|streamlit.components" -- app.py src; then
            echo "Deprecated Streamlit component HTML call remains in application source"
            exit 1
          fi
          echo "DEPRECATED_STREAMLIT_HTML=NONE"

      - name: Headless Streamlit runtime smoke test
        if: ${{ steps.scope.outputs.docs_only != 'true' }}
        run: python scripts/headless_smoke.py

      # The smoke test reads text and cannot see layout. This drives the running app in
      # Chromium at phone and desktop widths and fails on headings off their columns,
      # labels wrapping to three lines, charts leaving width empty, frames taller than
      # what they draw and empty bands (owner, 20 Nov 2026: "Why doesn't your audit
      # capture such issues?").
      - uses: actions/setup-node@v7
        if: ${{ steps.scope.outputs.docs_only != 'true' }}
        with:
          node-version: 22
      - name: Layout audit (Dashboard, Portfolio, Actions, Breadth, Sectors, Screener, Indices, Backtest, Watchlist, Stock) and requirements
        if: ${{ steps.scope.outputs.docs_only != 'true' }}
        # The app here reads R2 as the live site does (S172, 21 Nov 2026): without the keys
        # it fell back to the release files and drew partial figures the live site did not.
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          mkdir -p artifacts
          python -c "from src.loaders import app_source as a; from src.storage.r2 import R2Archive; c = a.r2_config(); assert c, 'no R2 keys in this job'; print('R2 answered:', sum(1 for _ in zip(range(5), R2Archive(c).list_keys())), 'keys listed')"
          npm install --no-save --no-package-lock playwright@1.63.0
          npx playwright install --with-deps chromium
          streamlit run app.py --server.port 8501 --server.headless true > artifacts/layout_app.log 2>&1 &
          for i in $(seq 1 90); do curl -sf http://localhost:8501/_stcore/health >/dev/null && break; sleep 2; done
          node scripts/layout_audit.mjs http://localhost:8501/ 412,1400
          node scripts/layout_audit.mjs http://localhost:8501/portfolio 412,1400 --open
          node scripts/layout_audit.mjs http://localhost:8501/actions 412,1400
          node scripts/check_dashboard_requirements.mjs http://localhost:8501/actions docs/ACTIONS_REQUIREMENTS.md
          node scripts/layout_audit.mjs http://localhost:8501/market 412,1400
          node scripts/check_dashboard_requirements.mjs http://localhost:8501/market docs/MARKET_REQUIREMENTS.md
          node scripts/layout_audit.mjs http://localhost:8501/sectors 412,1400
          node scripts/check_dashboard_requirements.mjs http://localhost:8501/sectors docs/SECTORS_REQUIREMENTS.md
          node scripts/layout_audit.mjs http://localhost:8501/screener 412,1400
          node scripts/check_dashboard_requirements.mjs http://localhost:8501/screener docs/SCREENER_REQUIREMENTS.md
          node scripts/layout_audit.mjs http://localhost:8501/indices 412,1400
          node scripts/check_dashboard_requirements.mjs http://localhost:8501/indices docs/INDICES_REQUIREMENTS.md
          node scripts/layout_audit.mjs http://localhost:8501/backtest 412,1400 --open
          node scripts/check_dashboard_requirements.mjs http://localhost:8501/backtest docs/BACKTEST_REQUIREMENTS.md
          # The 8-rule numbers-and-words sheet on every page, 412 and 1400 px (S173; owner, 22 Nov 2026; PAGE_DESIGN §3a).
          # --save / --cache: the nine pages both audits read are loaded once (S205 step 2).
          node scripts/number_format_audit.mjs --save "$RUNNER_TEMP/page_text" http://localhost:8501/ http://localhost:8501/actions http://localhost:8501/screener \
            http://localhost:8501/portfolio http://localhost:8501/market http://localhost:8501/indices http://localhost:8501/sectors \
            http://localhost:8501/backtest http://localhost:8501/guide http://localhost:8501/watchlist "http://localhost:8501/stock?stock=RELIANCE"
          # The glossary's "Not" forms on every page, 412 and 1400 px (S193 item D, docs/GLOSSARY.md); Nano Cap's
          # Dashboard, Portfolio and Actions as well, the pages whose sentences change most with the system.
          node scripts/glossary_audit.mjs --cache "$RUNNER_TEMP/page_text" http://localhost:8501/ http://localhost:8501/actions http://localhost:8501/screener \
            http://localhost:8501/portfolio http://localhost:8501/market http://localhost:8501/indices http://localhost:8501/sectors \
            http://localhost:8501/backtest http://localhost:8501/guide http://localhost:8501/configuration \
            "http://localhost:8501/watchlist?wl=CUPID,KOTAKBANK,GLAND,EMCURE,AUROPHARMA,DIACABS,SYRMA,TCS,SPECTRUM,TATAMOTORS" \
            "http://localhost:8501/stock?stock=SANSERA" "http://localhost:8501/?sys=nano" "http://localhost:8501/portfolio?sys=nano" \
            "http://localhost:8501/actions?sys=nano"
          # CI's browser has no saved list: the Watchlist reads the list its requirements were written on (S182).
          WL="http://localhost:8501/watchlist?wl=CUPID,KOTAKBANK,GLAND,EMCURE,AUROPHARMA,DIACABS,SYRMA,TCS,SPECTRUM,TATAMOTORS"
          node scripts/layout_audit.mjs "$WL" 412,1400
          node scripts/check_dashboard_requirements.mjs "$WL" docs/WATCHLIST_REQUIREMENTS.md
          node scripts/layout_audit.mjs http://localhost:8501/watchlist 412,1400
          # The stock page (S182, mock-up v2 approved 23 Nov 2026): layout, its requirements, and a chart that does not move on hover (row 48).
          node scripts/layout_audit.mjs "http://localhost:8501/stock?stock=SANSERA" 412,1400
          node scripts/check_dashboard_requirements.mjs "http://localhost:8501/stock?stock=SANSERA" docs/STOCK_REQUIREMENTS.md
          node scripts/chart_hover_audit.mjs "http://localhost:8501/stock?stock=SANSERA" 412,1400

      - name: Upload V1 validation artifacts
        if: ${{ steps.scope.outputs.docs_only != 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: v1-validation-artifacts
          retention-days: 14
          path: artifacts/
          if-no-files-found: error

