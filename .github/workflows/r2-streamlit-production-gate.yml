name: R2 Streamlit read-path gate

on:
  push:
    branches: [main]
    paths:
      - "app.py"
      - "r2/consumers/r2_streamlit.py"
      - "r2/consumers/r2_research.py"
      - "src/loaders/price_source.py"
      - "src/storage/**"
      - "tests/test_r2_streamlit_reader.py"
      - ".github/workflows/r2-streamlit-production-gate.yml"
  workflow_dispatch:
    inputs:
      expected_sha:
        description: "Immutable Screener revision SHA-256"
        required: true
        default: "df03ed6d6fb9c8ca963c4f3fb3b73386c43e6f106cc9a3307d7b693cf80455dd"
      expected_as_of:
        description: "Immutable Screener evidence date"
        required: true
        default: "2026-09-21"

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_STREAMLIT_READER_ENABLED: "1"
      R2_STREAMLIT_DATASET: "prices/screener"
      R2_STREAMLIT_AS_OF: ${{ inputs.expected_as_of || '2026-09-21' }}
      R2_STREAMLIT_REVISION_SHA256: ${{ inputs.expected_sha || 'df03ed6d6fb9c8ca963c4f3fb3b73386c43e6f106cc9a3307d7b693cf80455dd' }}
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt pytest
      - name: Download canonical release artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/r2-streamlit
          gh release download data-latest --repo "$GITHUB_REPOSITORY" --pattern "screener_prices.parquet" --dir /tmp/r2-streamlit --clobber
      - name: Verify immutable R2 adapter against canonical release
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          import pandas as pd
          from r2.consumers.r2_streamlit import read_configured_screener
          from src.loaders.price_source import from_screener

          release_path = Path("/tmp/r2-streamlit/screener_prices.parquet")
          release_sha = hashlib.sha256(release_path.read_bytes()).hexdigest()
          expected = "df03ed6d6fb9c8ca963c4f3fb3b73386c43e6f106cc9a3307d7b693cf80455dd"
          assert release_sha == expected, (release_sha, expected)
          release = pd.read_parquet(release_path)
          r2_frame, pin = read_configured_screener()
          assert pin.dataset == "prices/screener"
          assert pin.as_of == "2026-09-21"
          assert pin.revision_sha256 == expected
          pd.testing.assert_frame_equal(release.sort_index(axis=1), r2_frame.sort_index(axis=1), check_dtype=True, check_like=True)
          release_price = from_screener(release)
          r2_price = from_screener(r2_frame)
          assert release_price is not None and r2_price is not None
          pd.testing.assert_frame_equal(release_price.close.sort_index(axis=1), r2_price.close.sort_index(axis=1), check_dtype=True, check_like=True)
          pd.testing.assert_frame_equal(release_price.volume.sort_index(axis=1), r2_price.volume.sort_index(axis=1), check_dtype=True, check_like=True)
          assert release_price.source == r2_price.source == "screener"
          assert release_price.intraday == r2_price.intraday is False
          print(f"R2_STREAMLIT_GATE=PASS pin={pin.dataset}@{pin.as_of}:{pin.revision_sha256}")
          print(f"ROWS={len(r2_frame)} COLS={len(r2_frame.columns)}")
          print(f"MAX_DATE={pd.DatetimeIndex(r2_frame.index).max().date()}")
          PY
