name: NSE history import (2010 onwards)

# One-off fill of R2's NSE history (owner, 2026-10-02: "waiting 3 days not a
# good idea"). With pre2010_since, also the years before NSE's daily bundles
# begin (4 Jan 2010), from NSE's classic bhavcopy archive: a ranking on
# 1 Jan 2010 needs a year of history before it. Prices come from a public GitHub mirror of NSE's full
# bhavcopy (checked equal to NSE's own file, close and volume, on every row of
# two sample days); corporate actions from NSE's own list, one request a year.
# No daily bundle is asked of NSE. Re-running is safe: only what R2 lacks is
# published. See scripts/import_nse_history.py.
#
# Monthly (S47, owner 13 Oct 2026: "must be automated and autonomous"): NSE's
# yearly corporate-action list for last year and this year (late revisions to
# last year's are caught in January), so the long-file build reads NSE's list
# as it stands, not as it stood on 2 Oct. A scheduled run imports no prices:
# the mirror ends in Sep 2023 and every session of it is on R2.
on:
  schedule:
    # The 2nd of each month, 21:13 UTC (02:43 IST on the 3rd): NSE quiet; before
    # the history audit (the 3rd, 22:37 UTC) and the long file's full re-read
    # (nse_long_prices, every Saturday).
    - cron: '13 21 2 * *'
  workflow_dispatch:
    inputs:
      minutes:
        description: "Minutes to spend publishing prices (at most 320)"
        default: "320"
      actions:
        description: "Also import corporate actions (yes/no)"
        default: "yes"
      actions_from:
        description: "First year of corporate actions to import"
        default: "2008"
      pre2010_since:
        description: "Also fetch NSE's classic bhavcopy from this day to 2009-12-31 (YYYY-MM-DD; empty: skip)"
        default: ""
      prices:
        description: "Also publish the mirror's sessions R2 lacks (yes/no)"
        default: "yes"

permissions:
  contents: read

concurrency:
  group: nse-history-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    env:
      PYTHONPATH: .
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      MINUTES: ${{ inputs.minutes || '320' }}
      # Dispatch: the year asked (default 2008). Schedule: empty, i.e. last year.
      ACTIONS_FROM: ${{ inputs.actions_from }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - run: pip install -r requirements.txt

      - name: Corporate actions to date (NSE's list, one request a year)
        if: inputs.actions != 'no'
        run: |
          # The import exits 1 when NSE gave no year at all (refused at the first):
          # a scheduled run then fails and scheduled_failure_alert opens an issue.
          from="${ACTIONS_FROM:-$(( $(date -u +%Y) - 1 ))}"
          echo "Corporate actions ${from} to $(date -u +%Y)"
          python scripts/import_nse_history.py --actions --from-year "$from"

      - name: Before 2010, NSE's classic bhavcopy (one request a session, 2 s apart)
        if: inputs.pre2010_since != ''
        run: |
          python scripts/fetch_nse_bhavcopy.py --since "${{ inputs.pre2010_since }}" --until 2009-12-31 --out bhav_pre2010
          python scripts/import_nse_history.py --prices --mirror bhav_pre2010 --since "${{ inputs.pre2010_since }}" --until 2009-12-31 --workers 8

      - name: Fetch the bhavcopy mirror (data/ only)
        if: github.event_name != 'schedule' && inputs.prices != 'no'
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/tilak999/NSE-Data-bank mirror
          git -C mirror sparse-checkout set data
          ls mirror/data | wc -l

      - name: Prices R2 lacks, oldest first
        if: github.event_name != 'schedule' && inputs.prices != 'no'
        run: |
          [ "${MINUTES%.*}" -gt 320 ] && MINUTES=320
          python scripts/import_nse_history.py --prices --mirror mirror/data --max-minutes "$MINUTES" --workers 8
