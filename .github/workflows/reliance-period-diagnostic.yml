name: Reliance Period Diagnostic

on:
  workflow_dispatch:

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Fetch RELIANCE and print calendar-period diagnostics
        run: |
          python - <<'PY'
          import pandas as pd
          from src.loaders.price_loader import fetch_price_history
          from src.engine.calendar_momentum import PERIODS, INDIA_TZ
          from datetime import datetime

          raw = fetch_price_history(["RELIANCE"], period="2y", force_refresh=True)
          if raw is None or raw.empty:
              raise SystemExit("No RELIANCE data returned")

          # fetch_price_history stores the raw yfinance OHLCV frame. Extract
          # RELIANCE Close robustly from either MultiIndex orientation.
          if isinstance(raw.columns, pd.MultiIndex):
              close = None
              if "RELIANCE" in raw.columns.get_level_values(0):
                  rel = raw.xs("RELIANCE", level=0, axis=1)
                  for name in ("Close", "Adj Close"):
                      if name in rel.columns:
                          close = rel[name]
                          break
              if close is None:
                  for name in ("Close", "Adj Close"):
                      if name in raw.columns.get_level_values(1):
                          close = raw.xs(name, level=1, axis=1).iloc[:, 0]
                          break
          else:
              if "RELIANCE" in raw.columns:
                  close = raw["RELIANCE"]
              elif "Close" in raw.columns:
                  close = raw["Close"]
              elif "Adj Close" in raw.columns:
                  close = raw["Adj Close"]
              else:
                  close = None

          if close is None:
              raise SystemExit(f"Could not identify RELIANCE Close. Columns: {list(raw.columns)}")

          close = pd.Series(close, copy=True)
          close.index = pd.DatetimeIndex(close.index).tz_localize(None).normalize()
          close = close.sort_index().dropna()

          as_of = pd.Timestamp(datetime.now(INDIA_TZ).date())
          end_idx = close.index.searchsorted(as_of, side="right") - 1
          if end_idx < 0:
              raise SystemExit("No market data on or before as-of date")

          end_date = close.index[end_idx]
          end_price = float(close.iloc[end_idx])

          print("=== RELIANCE CALENDAR PERIOD DIAGNOSTIC ===")
          print(f"As-of India date       : {as_of.date()}")
          print(f"Latest available date  : {end_date.date()}")
          print(f"Latest available price : {end_price:.6f}")
          print()

          for _, months in PERIODS.items():
              target = as_of - pd.DateOffset(months=months)
              start_idx = close.index.searchsorted(target, side="left")
              if start_idx >= len(close):
                  print(f"{months:2d}M: NO START DATA")
                  continue
              start_date = close.index[start_idx]
              start_price = float(close.iloc[start_idx])
              ret = end_price / start_price - 1.0
              n_prices = end_idx - start_idx + 1
              n_returns = max(0, n_prices - 1)
              print(
                  f"{months:2d}M: target={target.date()} | start={start_date.date()} | "
                  f"end={end_date.date()} | start_price={start_price:.6f} | "
                  f"end_price={end_price:.6f} | return={ret:.6%} | "
                  f"price_rows={n_prices} | daily_returns={n_returns}"
              )
          PY
