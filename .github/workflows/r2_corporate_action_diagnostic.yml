name: R2 Corporate Action Discrepancy Diagnostic

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Successful R2 Yahoo raw build run"
        required: true
        default: "35680527253"
      source_artifact_id:
        description: "Yahoo raw artifact ID"
        required: true
        default: "10675057293"

permissions:
  contents: read
  actions: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Download exact Yahoo raw artifact
        uses: actions/download-artifact@v4
        with:
          path: data_cache
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source_run_id }}
          artifact-ids: ${{ inputs.source_artifact_id }}
      - name: Normalize raw artifact
        run: |
          set -euo pipefail
          matches=($(find data_cache -type f -name 'prices_yahoo_raw.parquet' -print))
          test "${#matches[@]}" -eq 1
          mv "${matches[0]}" data_cache/prices_yahoo_raw.parquet
      - name: Download canonical V1 archive
        run: |
          mkdir -p data_cache
          curl --fail --location --retry 3 \
            https://github.com/Pareshking/Paresh/releases/download/data-latest/prices_full.parquet \
            --output data_cache/prices_full.parquet
      - name: Run corporate-action attribution
        run: |
          python scripts/r2_diagnose_corporate_action_discrepancies.py \
            --raw data_cache/prices_yahoo_raw.parquet \
            --v1 data_cache/prices_full.parquet \
            --events data/corporate_actions_log.json \
            --out data_cache/r2_corporate_action_diagnostic
      - name: Upload diagnostic evidence
        uses: actions/upload-artifact@v4
        with:
          name: r2-corporate-action-diagnostic
          path: data_cache/r2_corporate_action_diagnostic
          retention-days: 30
