name: One-time CSS render fix v2

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: >-
      github.event.head_commit.message != 'fix(ui): render custom CSS as HTML' &&
      github.event.head_commit.message != 'chore: remove temporary CSS fix workflows'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch CSS injection
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/ui/theme.py')
          text = path.read_text(encoding='utf-8')

          old_open = '''    st.markdown(\n        """\n        <link rel="preconnect"'''
          new_open = '''    st.markdown(\n        clean_html("""\n        <link rel="preconnect"'''
          if text.count(old_open) != 1:
              raise SystemExit(f'Expected exactly one unpatched CSS opener, found {text.count(old_open)}')
          text = text.replace(old_open, new_open, 1)

          old_close = '''        </style>\n        """,\n        unsafe_allow_html=True,\n    )'''
          new_close = '''        </style>\n        """),\n        unsafe_allow_html=True,\n    )'''
          if text.count(old_close) != 1:
              raise SystemExit(f'Expected exactly one CSS closer, found {text.count(old_close)}')
          text = text.replace(old_close, new_close, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate and push
        run: |
          python -m py_compile src/ui/theme.py
          grep -q 'clean_html("""' src/ui/theme.py
          grep -q 'unsafe_allow_html=True' src/ui/theme.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/ui/theme.py
          git commit -m 'fix(ui): render custom CSS as HTML'
          git push origin main
