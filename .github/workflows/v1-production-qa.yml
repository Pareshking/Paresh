name: V1 Production QA

on:
  workflow_dispatch:
  push:
    # R2 is independent infrastructure; do not run deployed-app QA for
    # R2-only changes. Production QA remains for application/V1 changes.
    paths-ignore:
      - 'src/storage/**'
    - 'src/consumers/r2_*.py'
      - 'scripts/r2_*.py'
      - 'scripts/build_trading_sessions.py'
      - 'scripts/build_market_cap_history.py'
      - 'tests/test_r2_*.py'
      - 'tests/test_build_trading_sessions.py'
      - 'tests/test_market_cap_history.py'
      - '.github/workflows/r2-*.yml'
      - '.github/workflows/r2_*.yml'
      - 'docs/R2_*.md'
      - 'docs/MARKET_DATA_ARCHIVE_R2_SPEC.md'
      - 'docs/RAW_PRICE_REBUILD.md'
    # `main` only, because this job probes the DEPLOYED app rather than the
    # checkout. It asserts the build Streamlit is serving equals github.sha
    # (UMIYA_EXPECTED_SHA below), and Streamlit Cloud serves the deployed
    # branch -- so on a feature branch that SHA can never appear. The probe
    # waited its full 300s for a swap that was never going to happen and then
    # failed, on all six pushes to claude/codebase-audit-xbu6ns, including one
    # that contained nothing but deletions of unreferenced code. Every
    # substantive assertion in those runs passed; only the build
    # correspondence failed, and the probe labelled it [INFRASTRUCTURE]
    # itself.
    #
    # A red check that cannot go green tells a reviewer nothing and trains
    # everyone to ignore it. When the Cloud app IS deliberately pointed at a
    # working branch, run this by hand with workflow_dispatch.
    branches: [main]
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"

jobs:
  production-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install QA dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests playwright
          python -m playwright install --with-deps chromium
      - name: Production QA
        env:
          # The app publishes the revision it is actually serving; the probe
          # waits for the swap instead of testing the previous build and
          # blaming this commit for it.
          UMIYA_EXPECTED_SHA: ${{ github.sha }}
        run: python scripts/production_qa.py
      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v1-production-qa
          path: artifacts/production_qa/
          if-no-files-found: warn
