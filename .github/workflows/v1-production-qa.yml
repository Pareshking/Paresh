name: V1 Production QA

# Acceptance gate: production QA must execute against the exact live commit.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'src/storage/**'
      - 'r2/consumers/**'
      - 'r2/raw/**'
      - 'scripts/r2_*.py'
      - 'scripts/build_trading_sessions.py'
      - 'scripts/build_market_cap_history.py'
      - 'tests/test_r2_*.py'
      - 'tests/test_build_trading_sessions.py'
      - 'tests/test_market_cap_history.py'
      - '.github/workflows/r2-*.yml'
      - '.github/workflows/r2_*.yml'
      - 'docs/R2_*.md'
      - 'docs/MARKET_DATA_ARCHIVE_R2_SPEC.md'
      - 'docs/RAW_PRICE_REBUILD.md'
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"

# Never let two runs of this workflow write the same objects at once.
concurrency:
  group: v1-production-qa
  cancel-in-progress: false

jobs:
  production-qa:
    # Production QA probes the deployed main app; feature-branch pushes are not deployment targets.
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      # Full history: the deploy-correspondence check asks git whether the
      # build production serves descends from the triggering commit.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - name: Install QA dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests playwright
          python -m playwright install --with-deps chromium
      - name: Production QA
        env:
          # The app publishes the revision it is actually serving; the probe
          # waits for the swap instead of testing the previous build and
          # blaming this commit for it.
          UMIYA_EXPECTED_SHA: ${{ github.sha }}
        run: python scripts/production_qa.py
      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: v1-production-qa
          path: artifacts/production_qa/
          if-no-files-found: warn
