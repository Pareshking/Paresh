name: V1 Production QA

on:
  workflow_dispatch:
  push:
    branches: [main, 'claude/**']
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"

jobs:
  production-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install QA dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests playwright
          python -m playwright install --with-deps chromium
      - name: Production QA
        env:
          # The app publishes the revision it is actually serving; the probe
          # waits for the swap instead of testing the previous build and
          # blaming this commit for it.
          UMIYA_EXPECTED_SHA: ${{ github.sha }}
        run: python scripts/production_qa.py
      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v1-production-qa
          path: artifacts/production_qa/
          if-no-files-found: warn
