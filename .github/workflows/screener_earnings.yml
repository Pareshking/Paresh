name: Screener earnings (weekly, Saturday)

# Earnings growth for the broad indices, our calculation from companies' reported results (S171; owner,
# 25 Nov 2026: "We will use Screener data only", weekly on Saturday), and each stock's results table. Reads
# the Screener.in company page (~2,400, 1.5 s apart, ~2 h at ~3 s a page) of every index member on the last 13 quarter
# ends and every stock the site lists,
# then writes data/reference/screener_quarters.csv and data/reference/screener_earnings.csv
# (scripts/screener_earnings.py). Readers: the Indices page's Earnings section and the Stock page's results table.
# Every quarter read is kept in R2 (fundamentals/screener_quarters, parquet), one revision a week; the repo keeps
# only the pages' copy of the last 13 quarters.
# The run log prints each quarter where our Nifty 50 or Nifty 500 figure is more than 5 points from NSE's
# published one: a report, not a gate.
on:
  schedule:
    - cron: '23 4 * * 6'    # Saturday 04:23 UTC (09:53 IST)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: screener-earnings
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Pages are untrusted input: kept outside the checkout, read with python -I.
      - name: Read the company pages from Screener.in
        env:
          PYTHONPATH: .
        run: python -I scripts/screener_earnings.py fetch --cache "$RUNNER_TEMP/screener_pages"

      # Starts from R2's published store, so every quarter read since the first run is kept.
      - name: Build the earnings files and the NSE check
        env:
          PYTHONPATH: .
        run: |
          python -I scripts/screener_earnings.py build --cache "$RUNNER_TEMP/screener_pages" \
            --store screener_quarters.parquet --from-r2

      - name: Publish the full history to R2
        env:
          PYTHONPATH: .
        run: |
          python scripts/r2_publish.py \
            --skip-if-published \
            --path screener_quarters.parquet \
            --dataset fundamentals/screener_quarters \
            --source screener_company_quarters \
            --key-root archive/fundamentals/screener_quarters \
            --pipeline-version "screener_quarters_v1" \
            --release-tag data-latest

      - name: Commit and push the earnings files
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          files="data/reference/screener_quarters.csv data/reference/screener_earnings.csv"
          git add $files
          if git diff --staged --quiet; then
            echo "No earnings changes to commit."
            exit 0
          fi
          git commit -m "chore(data): Screener earnings, weekly [skip ci]"
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected on attempt $attempt; rebasing onto origin/main."
            git fetch origin main
            git rebase origin/main || {
              git checkout --theirs -- $files 2>/dev/null || true
              git add $files
              GIT_EDITOR=true git rebase --continue || git rebase --abort
            }
            sleep $((attempt * 3))
          done
          echo "::error::Could not push the earnings files after 5 attempts."
          exit 1
