name: R2 Cost Observability

on:
  # No schedule (audit A3, 7 Nov 2026): it failed every scheduled run since 28 Sep
  # (`ModuleNotFoundError: No module named 'src'`: no PYTHONPATH), and the daily
  # r2_archive_inventory.yml already reports storage per dataset from list sizes.
  # Kept for a manual request/storage estimate.
  workflow_dispatch:

permissions:
  contents: read

# Never let two runs of this workflow write the same objects at once.
concurrency:
  group: r2-publish-r2_cost_observability
  cancel-in-progress: false

jobs:
  cost-observability:
    runs-on: ubuntu-latest
    # One HEAD per manifest revision: about 10 minutes on 28 Sep, more since.
    timeout-minutes: 30
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - run: pip install -r requirements.txt pytest
      - name: Unit tests
        run: python -m pytest -q tests/test_r2_cost_audit.py
      - name: Live inventory and request/storage observability
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python scripts/r2_cost_audit.py
