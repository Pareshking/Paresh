name: R2 Cost Observability

on:
  workflow_dispatch:
  schedule:
    - cron: "41 4 * * 1"

permissions:
  contents: read

# Never let two runs of this workflow write the same objects at once.
concurrency:
  group: r2-publish-r2_cost_observability
  cancel-in-progress: false

jobs:
  cost-observability:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - run: pip install -r requirements.txt pytest
      - name: Unit tests
        run: python -m pytest -q tests/test_r2_cost_audit.py
      - name: Live inventory and request/storage observability
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python scripts/r2_cost_audit.py
