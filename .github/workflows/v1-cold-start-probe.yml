name: V1 Cold Start Probe

on:
  workflow_dispatch:
    inputs:
      preroll_seconds:
        description: "Wait before probing, to let a redeploy actually begin"
        required: false
        default: "0"
      ready_budget_seconds:
        description: "How long a cold pipeline may run before we stop and report it"
        required: false
        default: "1500"

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"

jobs:
  cold-start:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install probe dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests playwright
          python -m playwright install --with-deps chromium
      - name: Pre-roll
        run: sleep "${{ github.event.inputs.preroll_seconds }}"
      - name: Measure cold start
        env:
          UMIYA_READY_BUDGET_S: ${{ github.event.inputs.ready_budget_seconds }}
        run: python scripts/cold_start_probe.py
      - name: Upload measurement
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v1-cold-start-probe
          path: artifacts/cold_start_probe/
          if-no-files-found: warn
