name: V1 Cold Start Probe

on:
  workflow_dispatch:
    inputs:
      preroll_seconds:
        description: "Wait before probing, to let a redeploy actually begin"
        required: false
        default: "0"
      ready_budget_seconds:
        description: "How long a cold pipeline may run before we stop and report it"
        required: false
        default: "1500"

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"

jobs:
  cold-start:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install probe dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests playwright
          python -m playwright install --with-deps chromium
      # The input reaches the shell through the environment, never through
      # ${{ }} interpolation into the script body: a dispatch input is
      # attacker-controllable text the moment anyone else holds write access,
      # and interpolation splices it into the command before bash ever sees a
      # quote. Via env it is data, and the digit check makes a non-number fail
      # loudly instead of running.
      - name: Pre-roll
        env:
          PREROLL_SECONDS: ${{ github.event.inputs.preroll_seconds }}
        run: |
          seconds="${PREROLL_SECONDS:-0}"
          case "$seconds" in
            ''|*[!0-9]*) echo "::error::preroll_seconds must be a whole number of seconds; got '$seconds'"; exit 1 ;;
          esac
          sleep "$seconds"
      - name: Measure cold start
        env:
          UMIYA_READY_BUDGET_S: ${{ github.event.inputs.ready_budget_seconds }}
        run: python scripts/cold_start_probe.py
      - name: Upload measurement
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v1-cold-start-probe
          path: artifacts/cold_start_probe/
          if-no-files-found: warn
