name: R2 Yahoo Raw Exact Retry

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Successful R2 Yahoo raw build run containing the exact artifact to retry"
        required: true
        default: "35680527253"
      source_artifact_id:
        description: "Artifact ID from the source run"
        required: true
        default: "10675057293"
      pipeline_version:
        description: "Pipeline version recorded by the original publication"
        required: true
        default: "r2-yahoo-raw-5f4e52e812d324f1ef8f470212023b60b23d9df1"

permissions:
  contents: read
  actions: read

jobs:
  retry:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      PYTHONPATH: .
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download exact source artifact
        uses: actions/download-artifact@v4
        with:
          path: data_cache
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source_run_id }}
          artifact-ids: ${{ inputs.source_artifact_id }}

      - name: Verify exact source artifact
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import pandas as pd

          p = Path("data_cache/prices_yahoo_raw.parquet")
          assert p.is_file(), p
          f = pd.read_parquet(p)
          assert isinstance(f.columns, pd.MultiIndex)
          assert set(f.columns.get_level_values(1)) == {"Open", "High", "Low", "Close", "Volume"}
          assert len(f) > 0
          symbols = len(set(f.columns.get_level_values(0)))
          assert symbols == 750
          digest = hashlib.sha256(p.read_bytes()).hexdigest()
          print(f"EXACT_SOURCE_ARTIFACT PASS sha256={digest} rows={len(f)} symbols={symbols}")
          PY

      - name: Exact-byte immutable retry
        run: |
          python scripts/r2_publish.py             --path data_cache/prices_yahoo_raw.parquet             --dataset prices/yahoo/raw             --source yahoo_raw_unadjusted             --key-root archive/prices/yahoo/raw             --pipeline-version "${{ inputs.pipeline_version }}"             --release-tag data-latest

      - name: Record retry completion
        run: echo "R2 Yahoo exact-byte retry completed successfully."
