name: NSE daily bundle collection

# NSE's own end-of-day record into R2, one file per trading day: prices
# (unadjusted OHLC), corporate actions and market caps, plus a check of
# where Screener and Yahoo disagree with it. Record only -- the ranking
# still uses Screener (owner, 2026-09-27) until this history is complete and
# compared. See scripts/nse_collect.py.
#
# Every four hours: the newest days first, then up to 100 older ones, 2.5 s
# apart (about 18 s a day with publishing, so a run takes ~30 min). A refusal from NSE ends the run quietly and the next run resumes, so
# the ten-year backfill takes a few days and never hammers the site.
on:
  schedule:
    - cron: "25 */4 * * *"
  workflow_dispatch:
    inputs:
      backfill:
        description: "Older trading days to fetch this run"
        default: "100"
  pull_request:
    paths:
      - "src/loaders/nse_bundle.py"
      - "src/engine/source_check.py"
      - "scripts/nse_collect.py"
      - "tests/test_nse_bundle.py"
      - ".github/workflows/nse_collect.yml"

permissions:
  contents: read

concurrency:
  group: r2-publish-nse
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Unit tests
        run: python -m pytest -q tests/test_nse_bundle.py
      # On a pull request: fetch real bundles and show how they parse. No R2.
      - name: Probe live bundles
        if: github.event_name == 'pull_request'
        run: python scripts/nse_collect.py --probe latest --probe 2017-03-15
      - name: Fetch the calendar and the sources to check against
        if: github.event_name != 'pull_request'
        run: |
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/data-latest"
          for f in prices_full.parquet screener_prices.parquet prices.parquet; do
            curl -sSfL -o "$f" "$base/$f" || echo "::warning::could not fetch $f"
          done
      - name: Collect and check
        if: github.event_name != 'pull_request'
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          BACKFILL: ${{ inputs.backfill || '100' }}
        run: |
          # Sample year first (owner, 2026-09-27): test everything on about
          # 18 months before reaching back ten years. Move this date back
          # once the sample checks are signed off.
          python scripts/nse_collect.py --recent 7 --backfill "$BACKFILL" --since 2025-04-01 \
            --calendar prices_full.parquet --check \
            --screener screener_prices.parquet --yahoo prices.parquet
