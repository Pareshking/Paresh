name: NSE daily bundle collection

# NSE's own end-of-day record into R2, one file per trading day: prices
# (unadjusted OHLC), corporate actions and market caps, plus a check of
# where Screener disagrees with it. See scripts/nse_collect.py.
#
# Every four hours: the newest days first, then older ones back to January
# 2010 (owner, 2026-10-02: "bhav copy download starting today back to 2010";
# NSE's archive serves the same bundle back to 4 Jan 2010), 2.5 s apart --
# about 18 s a day with publishing. A scheduled run spends at most 50
# minutes; a manual run can spend up to 330. A refusal from NSE ends the
# run quietly and the next run resumes. Holidays are remembered in
# nse/closed_days, so each is asked once.
on:
  schedule:
    - cron: "25 */4 * * *"
  workflow_dispatch:
    inputs:
      backfill:
        description: "Older trading days to fetch this run"
        default: "150"
      minutes:
        description: "Minutes this run may spend collecting (at most 330)"
        default: "50"
      since:
        description: "Oldest day to backfill to (YYYY-MM-DD)"
        default: "2010-01-01"
      dates:
        description: "Extra days to collect, space-separated YYYY-MM-DD (weekend special sessions)"
        default: ""
  pull_request:
    paths:
      - "src/loaders/nse_bundle.py"
      - "src/engine/source_check.py"
      - "scripts/nse_collect.py"
      - "tests/test_nse_bundle.py"
      - ".github/workflows/nse_collect.yml"

permissions:
  contents: read

concurrency:
  group: r2-publish-nse
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Unit tests
        run: python -m pytest -q tests/test_nse_bundle.py
      # On a pull request: fetch real bundles and show how they parse. No R2.
      - name: Probe live bundles
        if: github.event_name == 'pull_request'
        run: python scripts/nse_collect.py --probe latest --probe 2017-03-15
      - name: Fetch Screener's store to check against
        if: github.event_name != 'pull_request'
        run: |
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/data-latest"
          curl -sSfL -o screener_prices.parquet "$base/screener_prices.parquet" \
            || echo "::warning::could not fetch screener_prices.parquet"
      - name: Collect and check
        if: github.event_name != 'pull_request'
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          BACKFILL: ${{ inputs.backfill || '150' }}
          MINUTES: ${{ inputs.minutes || '50' }}
          SINCE: ${{ inputs.since || '2010-01-01' }}
          DATES: ${{ inputs.dates || '' }}
        run: |
          [ "${MINUTES%.*}" -gt 330 ] && MINUTES=330
          python scripts/nse_collect.py --recent 7 --backfill "$BACKFILL" --since "$SINCE" \
            --max-minutes "$MINUTES" --dates "$DATES" \
            --check --screener screener_prices.parquet
