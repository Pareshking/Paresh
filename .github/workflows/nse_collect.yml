name: NSE daily bundle collection

# NSE's own end-of-day record into R2, one file per trading day: prices
# (unadjusted OHLC), corporate actions and market caps, plus a check of
# where Screener disagrees with it. See scripts/nse_collect.py.
#
# The newest days first, then any older one missing back to January 2010
# (owner, 2026-10-02: "bhav copy download starting today back to 2010"; NSE's
# archive serves the same bundle back to 4 Jan 2010), 2.5 s apart -- about 18 s
# a day with publishing. A scheduled run spends at most 50 minutes; a manual run
# can spend up to 330. A refusal from NSE ends the run quietly and the next run
# resumes. Holidays are remembered in nse/closed_days, so each is asked once.
#
# When (audit A7, 7 Nov 2026). It ran every four hours while the backfill to 2010
# was being fetched; that finished ("0 days to go" since late October), and the
# runs between evenings re-read the same seven days. NSE had the 4 Nov bundle up
# by 12:18 UTC (17:48 IST). Trading days: 12:41 UTC, and 14:41 and 16:11 UTC in
# case NSE is late -- all before ss_sync's three-source check (16:32) and
# daily_sync (17:30, and again after the Screener sync), which read these days
# from R2. Every run, and daily at 03:41 UTC: every weekday (--recent 7) and
# weekend day (--weekends 10) not yet on R2 and not recorded closed. No holiday list is
# needed: a day with no bundle is logged "absent", and once a week old it is
# recorded in nse/closed_days and never asked again. NSE's announced sessions
# (holiday list's Muhurat, special_sessions.csv) are also asked by date.
on:
  schedule:
    - cron: "41 12 * * 1-5"
    - cron: "41 14 * * 1-5"
    - cron: "11 16 * * 1-5"
    - cron: "41 3 * * *"
  workflow_dispatch:
    inputs:
      backfill:
        description: "Older trading days to fetch this run"
        default: "150"
      minutes:
        description: "Minutes this run may spend collecting (at most 330)"
        default: "50"
      since:
        description: "Oldest day to backfill to (YYYY-MM-DD)"
        default: "2010-01-01"
      dates:
        description: "Extra days to collect, space-separated YYYY-MM-DD (weekend special sessions)"
        default: ""
  pull_request:
    paths:
      - "src/loaders/nse_bundle.py"
      - "src/engine/source_check.py"
      - "scripts/nse_collect.py"
      - "tests/test_nse_bundle.py"
      - ".github/workflows/nse_collect.yml"

permissions:
  contents: read

concurrency:
  group: r2-publish-nse
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Unit tests
        run: python -m pytest -q tests/test_nse_bundle.py
      # On a pull request: fetch real bundles and show how they parse. No R2.
      - name: Probe live bundles
        if: github.event_name == 'pull_request'
        run: python scripts/nse_collect.py --probe latest --probe 2017-03-15
      # Which bytes the release is serving right now: the asset's own size and
      # upload time, from the API (no download). It is the cache key below, so
      # a restored copy can only ever be the copy the release holds -- a new
      # store published by screener_sync changes updatedAt and misses the
      # cache. TODO C7: this store is 8.79 MB and every one of the four daily
      # fires downloaded it again for bytes that change once a day
      # (screener_sync, ~18:45 UTC, after all three intraday fires).
      - name: Identify the published Screener store
        id: screener_asset
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ID="$(gh release view data-latest --repo "$GITHUB_REPOSITORY" \
                  --json assets \
                  --jq '.assets[] | select(.name=="screener_prices.parquet") | "\(.size)-\(.updatedAt)"' \
                2>/dev/null || true)"
          if [ -z "$ID" ]; then
            echo "::warning::could not identify screener_prices.parquet on the release"
            ID="unknown-${GITHUB_RUN_ID}"
          fi
          echo "key=screener-store-$(printf '%s' "$ID" | sha256sum | cut -c1-32)" >> "$GITHUB_OUTPUT"
          echo "Published store: $ID"

      - name: Restore the Screener store
        id: restore_screener
        if: github.event_name != 'pull_request'
        uses: actions/cache/restore@v6
        with:
          path: screener_prices.parquet
          key: ${{ steps.screener_asset.outputs.key }}

      # Only on a miss: the first fire after a new store is published pays the
      # 8.79 MB, the fires that follow it read the same bytes from the cache.
      # --check therefore runs on every fire exactly as before, on a file that
      # is identical to the published asset by construction.
      - name: Fetch Screener's store to check against
        id: fetch_screener
        if: github.event_name != 'pull_request' && steps.restore_screener.outputs.cache-hit != 'true'
        run: |
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/data-latest"
          if curl -sSfL -o screener_prices.parquet.part "$base/screener_prices.parquet"; then
            # A half-written or error-page download must not be cached under the
            # key that says "these are the published bytes": every later fire of
            # the day would then read it. Only a parquet that opens and has rows
            # is kept, and only then is it saved.
            if python -c "import sys, pyarrow.parquet as pq; sys.exit(0 if pq.ParquetFile(sys.argv[1]).metadata.num_rows > 0 else 1)" screener_prices.parquet.part; then
              mv screener_prices.parquet.part screener_prices.parquet
              echo "cacheable=true" >> "$GITHUB_OUTPUT"
            else
              rm -f screener_prices.parquet.part
              echo "::warning::screener_prices.parquet did not download as a readable parquet"
            fi
          else
            rm -f screener_prices.parquet.part
            echo "::warning::could not fetch screener_prices.parquet"
          fi

      - name: Save the Screener store
        if: github.event_name != 'pull_request' && steps.fetch_screener.outputs.cacheable == 'true'
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: screener_prices.parquet
          key: ${{ steps.screener_asset.outputs.key }}
      - name: Collect and check
        if: github.event_name != 'pull_request'
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          BACKFILL: ${{ inputs.backfill || '150' }}
          MINUTES: ${{ inputs.minutes || '50' }}
          SINCE: ${{ inputs.since || '2010-01-01' }}
          DATES: ${{ inputs.dates || '' }}
          # Every run also asks for every weekend day of the last 10 days not yet on R2
          # or recorded closed: a Muhurat, Budget or special session is collected the
          # next run without knowing the holiday list in advance (a dropped run cannot
          # delay it past the next).
          WEEKENDS: '10'
        run: |
          [ "${MINUTES%.*}" -gt 330 ] && MINUTES=330
          python scripts/nse_collect.py --recent 7 --backfill "$BACKFILL" --since "$SINCE" \
            --max-minutes "$MINUTES" --dates "$DATES" --weekends "$WEEKENDS" \
            --check --screener screener_prices.parquet
