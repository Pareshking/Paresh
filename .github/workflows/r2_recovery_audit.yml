name: R2 recovery audit

on:
  workflow_dispatch:
  schedule:
    - cron: "47 3 * * 1"
  push:
    branches: [main]
    paths:
      - "scripts/r2_recovery_audit.py"
      - "tests/test_r2_recovery_audit.py"
      - ".github/workflows/r2_recovery_audit.yml"

permissions:
  contents: read

# Never let two runs of this workflow write the same objects at once.
concurrency:
  group: r2-publish-r2_recovery_audit
  cancel-in-progress: false

jobs:
  recovery:
    runs-on: ubuntu-latest
    # Reads every immutable revision in the bucket, so it grows with the archive:
    # 7 min on 28 Sep, 31-38 min in October, cancelled at 40 on 2 Nov (audit A3,
    # 7 Nov 2026). 90 is a stopgap; bounding what it reads is TODO A3.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Unit tests
        run: python -m pytest -q tests/test_r2_recovery_audit.py
      - name: Live R2 recovery audit
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          PYTHONPATH: .
        run: python scripts/r2_recovery_audit.py --json
