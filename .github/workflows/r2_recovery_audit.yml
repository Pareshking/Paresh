name: R2 recovery audit

on:
  workflow_dispatch:
    inputs:
      full:
        description: "Download every revision (the complete audit), not only the last 14 days"
        type: boolean
        default: false
  schedule:
    # Monthly since 17 Nov 2026 (S141; weekly before): the 1st, 09:17 IST. The weekly
    # retention run still audits every dataset it deletes from.
    - cron: "47 3 1 * *"
  push:
    branches: [main]
    paths:
      - "scripts/r2_recovery_audit.py"
      - "tests/test_r2_recovery_audit.py"
      - ".github/workflows/r2_recovery_audit.yml"

permissions:
  contents: read

# Never let two runs of this workflow write the same objects at once.
concurrency:
  group: r2-publish-r2_recovery_audit
  cancel-in-progress: false

jobs:
  recovery:
    runs-on: ubuntu-latest
    # Downloading every revision grew with the archive: 7 min on 28 Sep, 31-38 in
    # October, cancelled at 40 on 2 Nov, 43 on 9 Nov, 34 on 16 Nov (A3). Since 16 Nov
    # every revision is still resolved and size-checked, but only the last 14 days
    # and each dataset's newest date are downloaded (owner's rule, 15 Nov: 30+ min
    # -> bound it). Run with full=true for the complete audit.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Unit tests
        run: python -m pytest -q tests/test_r2_recovery_audit.py
      - name: Live R2 recovery audit
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          PYTHONPATH: .
        run: |
          if [ "${{ inputs.full }}" = "true" ]; then
            python scripts/r2_recovery_audit.py --json --full
          else
            python scripts/r2_recovery_audit.py --json
          fi
