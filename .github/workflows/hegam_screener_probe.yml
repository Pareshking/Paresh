name: HEGAM Screener history probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe HEGAM Screener history only
        run: |
          python - <<'PY'
          import json
          import re
          import urllib.request
          from datetime import datetime, timezone

          symbol = "HEGAM"
          days = 3650
          headers = {"User-Agent": "Mozilla/5.0"}

          def get(url):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=30) as r:
                  return r.read().decode("utf-8")

          html = get(f"https://www.screener.in/company/{symbol}/")
          m = re.search(r"/api/company/(\d+)/", html)
          if not m:
              raise RuntimeError("Could not resolve Screener company ID for HEGAM")

          company_id = m.group(1)
          print(f"company_id={company_id}")

          chart_url = (
              f"https://www.screener.in/api/company/{company_id}/chart/"
              f"?q=Price-DMA50-Volume&days={days}"
          )
          data = json.loads(get(chart_url))

          print("top_level_keys=", list(data.keys()))
          datasets = data.get("datasets", [])
          print("dataset_count=", len(datasets))

          for i, item in enumerate(datasets):
              if isinstance(item, dict):
                  print(f"dataset_{i}_keys=", list(item.keys()))
                  print(f"dataset_{i}_name=", item.get("name"))
                  print(f"dataset_{i}_metric=", item.get("metric"))
                  print(f"dataset_{i}_label=", item.get("label"))

          # Find the price series by shape rather than assuming a particular
          # dataset metadata key.
          candidates = []
          for item in datasets:
              if not isinstance(item, dict):
                  continue
              if "timestamp" in item and "values" in item:
                  candidates.append(item)

          if not candidates:
              raise RuntimeError("No timestamp/value dataset returned by Screener")

          price = next(
              (
                  x for x in candidates
                  if str(x.get("name", "")).lower() == "price"
                  or str(x.get("metric", "")).lower() == "price"
                  or str(x.get("label", "")).lower() == "price"
              ),
              candidates[0],
          )

          timestamps = price["timestamp"]
          values = price["values"]

          rows = [
              (ts, value)
              for ts, value in zip(timestamps, values)
              if value is not None
          ]

          if not rows:
              raise RuntimeError("HEGAM price dataset is empty")

          def dt(ts):
              return datetime.fromtimestamp(ts, tz=timezone.utc).date().isoformat()

          print("========== HEGAM SCREENER HISTORY ==========")
          print(f"symbol={symbol}")
          print(f"requested_days={days}")
          print(f"rows={len(rows)}")
          print(f"first_date={dt(rows[0][0])}")
          print(f"last_date={dt(rows[-1][0])}")
          print(f"first_close={rows[0][1]}")
          print(f"last_close={rows[-1][1]}")

          print("first_10_rows:")
          for ts, value in rows[:10]:
              print(dt(ts), value)

          print("last_10_rows:")
          for ts, value in rows[-10:]:
              print(dt(ts), value)
          PY
