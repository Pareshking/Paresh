name: HEGAM Screener history probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe HEGAM Screener history only
        run: |
          python - <<'PY'
          import json
          import re
          import urllib.request

          symbol = "HEGAM"
          days = 3650
          headers = {"User-Agent": "Mozilla/5.0"}

          def get(url):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=30) as r:
                  return r.read().decode("utf-8")

          html = get(f"https://www.screener.in/company/{symbol}/")
          m = re.search(r"/api/company/(\d+)/", html)
          if not m:
              raise RuntimeError("Could not resolve Screener company ID for HEGAM")

          company_id = m.group(1)
          print(f"company_id={company_id}")

          chart_url = (
              f"https://www.screener.in/api/company/{company_id}/chart/"
              f"?q=Price-DMA50-Volume&days={days}"
          )
          data = json.loads(get(chart_url))
          price = next(
              x for x in data.get("datasets", [])
              if str(x.get("metric", "")).lower() == "price"
          )

          values = price.get("values", [])
          rows = [
              (pair[0], pair[1])
              for pair in values
              if isinstance(pair, (list, tuple))
              and len(pair) >= 2
              and pair[1] is not None
          ]

          if not rows:
              raise RuntimeError("HEGAM price dataset is empty")

          print("========== HEGAM SCREENER HISTORY ==========")
          print(f"symbol={symbol}")
          print(f"company_id={company_id}")
          print(f"requested_days={days}")
          print(f"metric={price.get('metric')}")
          print(f"label={price.get('label')}")
          print(f"meta={price.get('meta')}")
          print(f"rows={len(rows)}")
          print(f"first_date={rows[0][0]}")
          print(f"last_date={rows[-1][0]}")
          print(f"first_close={rows[0][1]}")
          print(f"last_close={rows[-1][1]}")

          print("first_10_rows:")
          for row in rows[:10]:
              print(row[0], row[1])

          print("last_10_rows:")
          for row in rows[-10:]:
              print(row[0], row[1])
          PY
