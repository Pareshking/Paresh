name: NSDL FPI probe

# S106 (owner, 8 Nov): FII/DII history. NSDL's FPI reports refused the Claude
# session; this prints what a GitHub runner gets, so the backfill can be
# written against the real page. Runs on pull requests that touch it, and by
# hand. Writes nothing.
on:
  pull_request:
    paths:
      - .github/workflows/nsdl_probe.yml
      - scripts/nsdl_fpi.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch NSDL pages
        run: |
          set +e
          for u in \
            https://www.fpi.nsdl.co.in/web/Reports/Latest.aspx \
            https://www.fpi.nsdl.co.in/web/Reports/Archive.aspx \
            "https://www.fpi.nsdl.co.in/web/Reports/Yearwise.aspx?RptType=6" ; do
            echo "=================== $u"
            curl -sS -L -m 40 -A 'Mozilla/5.0 (X11; Linux x86_64)' -o page.html -w 'HTTP %{http_code} %{size_download} bytes\n' "$u"
            echo "--- form fields:"
            grep -o '<input[^>]*name="[^"]*"' page.html | grep -v VIEWSTATE | sed 's/.*name="//; s/"$//' | sort -u | head -40
            grep -o '<select[^>]*name="[^"]*"' page.html | sed 's/.*name="//; s/"$//' | head -20
            echo "--- text (first 120 lines):"
            sed -e 's/<script[^>]*>.*<\/script>//g' -e 's/<[^>]*>/ /g' page.html | tr -s ' \t' ' ' | grep -v '^\s*$' | head -120
          done
