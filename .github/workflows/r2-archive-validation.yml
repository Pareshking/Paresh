name: R2 Archive Validation

on:
  workflow_dispatch:
  push:
    branches:
      - feat/r2-phase1-storage-adapter

permissions:
  contents: read

jobs:
  r2-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Run local storage tests
        run: pytest -q tests/test_r2_storage.py
        env:
          PYTHONPATH: .

      - name: Validate real R2 archive round trip
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          PYTHONPATH: .
        run: |
          python - <<'PY'
          import tempfile
          from pathlib import Path

          from src.storage.manifest import build_manifest, verify_manifest
          from src.storage.r2 import R2Archive, R2Config, R2ImmutableObjectExists

          config = R2Config.from_env()
          print("R2 configuration:", config.redacted())

          archive = R2Archive(config)
          payload = b"Paresh R2 Phase-1 archive validation\n"
          key = "tmp/r2-validation/${{ github.run_id }}.bin"

          with tempfile.TemporaryDirectory() as tmp:
              local = Path(tmp) / "sample.bin"
              local.write_bytes(payload)

              manifest = build_manifest(
                  local,
                  dataset="tmp/r2-validation",
                  as_of="2026-09-21",
                  source="test",
                  pipeline_version="phase1",
                  row_count=1,
                  symbol_count=1,
              )
              ok, reason = verify_manifest(local, manifest)
              if not ok:
                  raise SystemExit(f"Local manifest verification failed: {reason}")

              try:
                  archive.put_file(
                      key,
                      local,
                      content_type="application/octet-stream",
                      immutable=True,
                      verify=True,
                  )
                  print("PUT + size/SHA-256 verification: OK")

                  head = archive.head(key)
                  print(f"HEAD: size={head['ContentLength']}")

                  downloaded = Path(tmp) / "downloaded.bin"
                  archive.get_file(key, downloaded)
                  if downloaded.read_bytes() != payload:
                      raise SystemExit("GET verification failed: bytes differ")
                  print("GET + byte equality: OK")

                  if key not in set(archive.list_keys("tmp/r2-validation/")):
                      raise SystemExit("LIST verification failed: key not returned")
                  print("LIST verification: OK")

                  try:
                      archive.put_file(key, local, immutable=True, verify=False)
                  except R2ImmutableObjectExists:
                      print("IMMUTABILITY (If-None-Match=*): OK")
                  else:
                      raise SystemExit("Immutable overwrite was unexpectedly accepted")
              finally:
                  archive.delete(key)

              if archive.exists(key):
                  raise SystemExit("DELETE verification failed: object still exists")
              print("DELETE verification: OK")

          print("R2 ARCHIVE PHASE-1 VALIDATION PASSED")
          PY
