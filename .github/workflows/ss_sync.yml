name: SS price sync (gentle)

# Downloads the SS store a few symbols at a time, well under the site's
# rate limit (site owner, 2026-10-02: "do not hammer my site by downloading
# entire universe in one go, give some breathing to my website").
# Resumable: each run continues where the last one stopped. Runs nightly
# until everything is downloaded, then each run finds nothing to do.
on:
  schedule:
    - cron: "17 21 * * *"   # 02:47 IST, when the site is quietest
  workflow_dispatch:
    inputs:
      rounds:
        description: "Rounds this run (5-minute rest between rounds)"
        default: "5"
      per_round:
        description: "Symbols per round"
        default: "40"

permissions:
  contents: write

concurrency:
  group: ss-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      PYTHONPATH: .
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ROUNDS: ${{ inputs.rounds || '5' }}
      PER_ROUND: ${{ inputs.per_round || '40' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - run: pip install -r requirements.txt

      - name: Restore what earlier runs saved
        run: |
          mkdir -p data_cache/ss
          gh release download data-latest --pattern 'ss_*' --dir data_cache/ss || echo "Nothing saved yet; starting fresh."
          cd data_cache/ss
          for f in ss_prices_*.parquet; do [ -f "$f" ] && mv "$f" "${f#ss_}"; done
          [ -f ss_manifest.json ] && mv ss_manifest.json manifest.json || true
          ls -la

      - name: Download gently
        env:
          SS_BASE_URL: ${{ secrets.SS_BASE_URL }}
        run: |
          set -o pipefail
          for i in $(seq 1 "$ROUNDS"); do
            echo "=== Round $i ==="
            python scripts/sync_ss.py --skip-done --delay 4 --limit "$PER_ROUND" | tee round.log \
              || { echo "Stopped (refused or nothing fetched); saving progress."; break; }
            if grep -q "^SS: 0 symbols" round.log; then echo "Everything is downloaded."; break; fi
            if [ "$i" -lt "$ROUNDS" ]; then sleep 300; fi
          done
          echo "Done."

      - name: Save to the data-latest release
        if: always()
        run: |
          cd data_cache/ss
          [ -f manifest.json ] || { echo "Nothing to save."; exit 0; }
          for f in prices_*.parquet; do cp "$f" "ss_$f"; done
          cp manifest.json ss_manifest.json
          gh release upload data-latest ss_prices_*.parquet ss_manifest.json --repo "$GITHUB_REPOSITORY" --clobber
          python -c "import json; m=json.load(open('manifest.json')); print('SYMBOLS SAVED:', len(m['symbols']), '| FAILED:', len(m['failed']), '| ROWS:', m.get('rows'))"
