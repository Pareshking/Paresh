name: Temporary R2 credential test

on:
  push:
    branches:
      - test/r2-credentials-20260921

permissions:
  contents: read

jobs:
  r2:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install boto3
        run: python -m pip install --quiet boto3

      - name: Test R2 write, read, and delete
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          python - <<'PY'
          import os
          import boto3

          required = ["R2_ACCOUNT_ID","R2_ACCESS_KEY_ID","R2_SECRET_ACCESS_KEY","R2_ENDPOINT","R2_BUCKET"]
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              raise SystemExit(f"Missing GitHub secret(s): {', '.join(missing)}")

          endpoint = os.environ["R2_ENDPOINT"]
          bucket = os.environ["R2_BUCKET"]
          key = "tmp/credential-test/github-actions-r2.txt"
          body = b"Paresh R2 credential test: write-read-delete OK"

          client = boto3.client(
              "s3",
              endpoint_url=endpoint,
              aws_access_key_id=os.environ["R2_ACCESS_KEY_ID"],
              aws_secret_access_key=os.environ["R2_SECRET_ACCESS_KEY"],
              region_name="auto",
          )

          client.put_object(Bucket=bucket, Key=key, Body=body)
          print(f"WRITE OK: s3://{bucket}/{key}")

          response = client.get_object(Bucket=bucket, Key=key)
          received = response["Body"].read()
          if received != body:
              raise SystemExit("READ FAILED: object contents differ")
          print("READ OK: object contents verified")

          client.delete_object(Bucket=bucket, Key=key)
          print("DELETE OK: temporary test object removed")

          try:
              client.head_object(Bucket=bucket, Key=key)
          except client.exceptions.ClientError as exc:
              status = exc.response.get("ResponseMetadata", {}).get("HTTPStatusCode")
              if status == 404:
                  print("VERIFY DELETE OK: object no longer exists")
              else:
                  raise
          else:
              raise SystemExit("DELETE VERIFY FAILED: object still exists")

          print("R2 CREDENTIAL TEST PASSED")
          PY
