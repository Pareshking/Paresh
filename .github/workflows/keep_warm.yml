name: Keep Production Warm

# Streamlit Community Cloud suspends an app that nobody has opened for a while.
# The next visitor then pays a FULL cold start -- a fresh container, a git
# clone, 54 packages installed, every import, and every cache rebuilt from
# nothing. That is the ~89 seconds the production log recorded on 2026-09-16,
# and no amount of work inside the app removes it, because the app is not
# running when the clock starts.
#
# One HTTPS GET keeps the container alive AND keeps the in-process caches warm,
# which is the cheaper half of the problem: @st.cache_data entries carry a
# one-hour TTL, so a visit inside that window finds the prices, the ranking and
# the engine already in memory rather than merely the process already started.
#
# Weekday hours only, in IST. There is nothing to keep warm for a reader who is
# not there, and a job that runs all night burns Actions minutes to serve
# nobody. The schedule below is UTC, so it is shifted back 5h30m: 03:00-14:00
# UTC is 08:30-19:30 IST, which covers the pre-open through the post-close
# review window.
on:
  schedule:
    - cron: '*/20 3-14 * * 1-5'
  workflow_dispatch:

# Nothing is read from or written to the repository. A ping needs no more.
permissions: {}

concurrency:
  # A late run must never queue up behind an earlier one; the point is a recent
  # visit, not every scheduled visit.
  group: keep-warm
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wake the app
        env:
          URL: https://paresh.streamlit.app/
        run: |
          # --max-time, because a cold container legitimately takes over a
          # minute to answer and cutting the request short would leave it
          # half-started. Failures never fail the workflow: a missed ping costs
          # one slow visit, and a red cron badge for something this peripheral
          # trains everyone to ignore the badge.
          CODE=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 180 "$URL" || echo "000")
          echo "GET $URL -> HTTP $CODE"
          if [ "$CODE" = "200" ]; then
            echo "Container is awake."
          else
            echo "::notice::Ping returned $CODE; the next visitor may pay a cold start."
          fi
