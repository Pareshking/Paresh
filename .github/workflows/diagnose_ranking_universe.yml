name: Diagnose published ranking universe

on:
  push:
    branches:
      - fix/ranking-universe-reconciliation

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Diagnose missing ranking symbol
        run: |
          python - <<'PY'
          import pandas as pd
          import urllib.request

          u = "https://github.com/Pareshking/Paresh/releases/download/data-latest/rankings.parquet"
          urllib.request.urlretrieve(u, "/tmp/rankings.parquet")

          ranking = pd.read_parquet("/tmp/rankings.parquet")
          idx = pd.read_csv("data/indices/ind_niftytotalmarket_list.csv")

          def canon(values):
              out = []
              for x in values:
                  s = str(x).strip().upper()
                  if not s or s.startswith("DUMMY"):
                      continue
                  out.append(s.removesuffix(".NS"))
              return out

          expected = set(canon(idx["Symbol"]))
          actual = set(canon(ranking["Symbol"]))
          missing = sorted(expected - actual)
          extra = sorted(actual - expected)

          print(f"RANKING_ROWS={len(ranking)}")
          print(f"EXPECTED_UNIVERSE={len(expected)}")
          print(f"PUBLISHED_UNIVERSE={len(actual)}")
          print(f"MISSING={missing}")
          print(f"EXTRA={extra}")
          if len(missing) != 1 or extra:
              raise SystemExit("Unexpected ranking universe delta")
          print("DIAGNOSIS=ONE_SYMBOL_MISSING")
          PY
