name: R2 retention

# Owner-approved policy (2026-09-25): prices/yahoo, snapshots/application and
# prices/screener keep the last 7 as_of dates plus every month-end; everything
# else keeps its full history. See scripts/r2_retention.py.
#
# WEEKLY, IT DELETES (owner, 2026-09-25: "Yes" to automatic weekly apply;
# without it prices/yahoo alone grows ~36 MB a day). The Sunday run plans,
# then applies exactly the count that plan printed -- if anything was
# published in between, the counts differ and nothing is deleted -- then runs
# the recovery audit over every remaining pointer and revision. Any failure
# alerts through scheduled_failure_alert.yml.
#
# On push it only plans. By hand: dispatch with apply=true and expect_deletes
# equal to the count a dry run printed.
on:
  schedule:
    - cron: "17 3 * * 0"  # Sunday 03:17 UTC, after Friday's weekly sync: plan, apply, audit
  workflow_dispatch:
    inputs:
      apply:
        description: "Delete for real (false = dry run)"
        type: boolean
        default: false
      expect_deletes:
        description: "RETENTION_DELETE_COUNT from the dry run (required to apply)"
        required: false
        default: ""
  push:
    branches: [main]
    paths:
      - "scripts/r2_retention.py"
      - "tests/test_r2_retention.py"
      - ".github/workflows/r2_retention.yml"

permissions:
  contents: read

concurrency:
  group: r2-publish-r2_retention
  cancel-in-progress: false

jobs:
  retention:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Unit tests
        run: python -m pytest -q tests/test_r2_retention.py
      - name: Plan (dry run)
        id: plan
        run: |
          set -euo pipefail
          python scripts/r2_retention.py --list | tee /tmp/retention_plan.txt
          count="$(sed -n 's/^RETENTION_DELETE_COUNT=\([0-9][0-9]*\).*/\1/p' /tmp/retention_plan.txt)"
          test -n "$count"
          echo "count=$count" >> "$GITHUB_OUTPUT"
      # Scheduled: apply the count this run's own plan printed (skipped when
      # there is nothing to delete). Dispatched: the count the person typed.
      - name: Apply
        id: apply
        if: >-
          ${{ (github.event_name == 'workflow_dispatch' && inputs.apply) ||
              (github.event_name == 'schedule' && steps.plan.outputs.count != '0') }}
        env:
          EXPECT: ${{ github.event_name == 'schedule' && steps.plan.outputs.count || inputs.expect_deletes }}
        run: python scripts/r2_retention.py --apply --expect-deletes "$EXPECT"
      # Every remaining current pointer and immutable revision must still
      # resolve and read end to end after a deletion.
      - name: Recovery audit after apply
        if: ${{ steps.apply.outcome == 'success' }}
        run: python scripts/r2_recovery_audit.py --json
