name: Screener 10Y history bootstrap

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: screener-10y-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download current Screener store
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p data_cache
          gh release download data-latest \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "screener_prices.parquet" \
            --dir data_cache \
            --clobber
          test -s data_cache/screener_prices.parquet

      - name: Run 10Y Screener bootstrap
        env:
          PYTHONPATH: .
          SCREENER_DELAY_S: "0.8"
        run: python scripts/screener_bootstrap_10y.py

      - name: Publish deep Screener history to R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          PYTHONPATH: .
        run: |
          python scripts/r2_publish.py \
            --path data_cache/screener_prices.parquet \
            --dataset prices/screener \
            --source screener \
            --key-root archive/prices/screener \
            --pipeline-version "screener-10y-${{ github.sha }}" \
            --release-tag data-latest

      - name: Publish deep Screener history to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload data-latest data_cache/screener_prices.parquet \
            --repo "$GITHUB_REPOSITORY" --clobber

      - name: Save bootstrap store for diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: screener-10y-bootstrap-${{ github.run_id }}
          path: data_cache/screener_prices.parquet
          retention-days: 7
