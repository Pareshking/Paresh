name: Benchmark Consistency Test

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt pytest
      - name: Compile modules
        run: python -m py_compile src/core/config.py src/loaders/price_loader.py src/engine/backtester.py
      - name: Run benchmark regression tests
        run: python -m pytest -q tests/test_benchmark_consistency.py
