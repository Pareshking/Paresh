name: V1 Hardening Once

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt pytest
      - name: Patch remaining quantitative defects
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          root = Path('.')

          p = root/'src/engine/calendar_momentum.py'
          t = p.read_text()
          old = '''    today = pd.Timestamp(datetime.now(INDIA_TZ).date())\n    last_data_date = pd.Timestamp(index[-1]).normalize()\n    return max(today, last_data_date)\n'''
          new = '''    today = pd.Timestamp(datetime.now(INDIA_TZ).date())\n    last_data_date = pd.Timestamp(index[-1]).normalize()\n    # Use today's calendar date for genuinely current data (including weekends\n    # and short exchange holidays), but anchor historical/stale datasets to\n    # their actual last observation so test and offline datasets cannot acquire\n    # a multi-year synthetic lookback horizon.\n    if today - last_data_date > pd.Timedelta(days=7):\n        return last_data_date\n    return max(today, last_data_date)\n'''
          if old not in t: raise SystemExit('calendar as-of block not found')
          p.write_text(t.replace(old,new,1))

          p = root/'src/engine/momentum.py'
          t = p.read_text()
          t = t.replace('if len(clean) < 3 or clean.std() == 0:', 'if len(clean) < 3 or clean.std(ddof=0) == 0:')
          t = t.replace('if len(clean) < 3 or clean.std() == 0:\n        return pd.Series(0.0, index=s.index)', 'if len(clean) < 3 or clean.std(ddof=0) == 0:\n        return pd.Series(np.nan, index=s.index)')
          t = re.sub(r'    def calculate_sharpe_momentum\(self\) -> pd\.DataFrame:\n.*?\n    def calculate_exp_regression', '''    def calculate_sharpe_momentum(self) -> pd.DataFrame:\n        """Compatibility entry point for the canonical calendar-month System-1 engine."""\n        from src.engine.calendar_momentum import apply_calendar_momentum\n        return apply_calendar_momentum(self)\n\n    def calculate_exp_regression''', t, flags=re.S)
          t = re.sub(r'    def calculate_exp_regression\(self, window: int = 126\) -> pd\.DataFrame:\n.*?\n    # ── System 3:', '''    def calculate_exp_regression(self, window: int = 126) -> pd.DataFrame:\n        """Calculate annualized rolling exponential-regression slope without synthetic fills."""\n        log_p = np.log(self.prices.clip(lower=0.01))\n        n = int(window)\n        score = pd.DataFrame(np.nan, index=log_p.index, columns=log_p.columns, dtype=float)\n        if n < 2 or len(log_p) < n:\n            self.exp_reg_scores = score\n            return score\n\n        t = np.arange(n, dtype=float)\n        t_rev = t[::-1]\n        t2_rev = (t * t)[::-1]\n        ones = np.ones(n, dtype=float)\n\n        for col in log_p.columns:\n            y = log_p[col].to_numpy(dtype=float)\n            mask = np.isfinite(y)\n            if int(mask.sum()) < n:\n                continue\n            y0 = np.where(mask, y, 0.0)\n            m = mask.astype(float)\n            n_obs = np.convolve(m, ones, mode="valid")\n            sum_y = np.convolve(y0, ones, mode="valid")\n            sum_t = np.convolve(m, t_rev, mode="valid")\n            sum_t2 = np.convolve(m, t2_rev, mode="valid")\n            sum_ty = np.convolve(y0, t_rev, mode="valid")\n            denom = n_obs * sum_t2 - sum_t * sum_t\n            numer = n_obs * sum_ty - sum_t * sum_y\n            valid = (n_obs >= n) & (denom > 1e-12)\n            slopes = np.full(len(n_obs), np.nan)\n            slopes[valid] = numer[valid] / denom[valid]\n            out = np.full(len(log_p), np.nan)\n            out[n - 1:] = np.exp(np.clip(slopes * 252.0, -700.0, 700.0)) - 1.0\n            score[col] = out\n\n        self.exp_reg_scores = score\n        return score\n\n    # ── System 3:''', t, flags=re.S)
          t = t.replace('            vol_df = self.volume.ffill()', '            vol_df = self.volume.copy()')
          p.write_text(t)

          p = root/'src/ui/theme.py'; t=p.read_text(); t=t.replace('Multipliers & Ratios (e.g. Sharpe, Sortino, Calmar, R2, Beta, Surge, Multiplier, Profit Factor, RS_Ratio, RS_Momentum)', 'Multipliers & Ratios (e.g. Sharpe, Sortino, Calmar, Beta, Surge, Multiplier, Profit Factor, RS_Ratio, RS_Momentum)'); p.write_text(t)
          p = root/'src/ui/views/qualified_view.py'; t=p.read_text(); t=t.replace('Multi-Window Sharpe × R² Composite', 'Multi-Window Risk-Adjusted Momentum Composite'); p.write_text(t)

          p = root/'src/engine/backtester.py'; t=p.read_text()
          old='''            composite_score = pd.Series(0.0, index=prices.columns)\n            for w_period, cw in zip(WINDOWS, norm_w if norm_w else [0.2] * 5):\n                if cw <= 0:\n                    continue\n                sharpe, _ = _calendar_period_sharpe(\n                    prices, log_ret, start_idx, int(w_period)\n                )\n                raw_mom = sharpe\n\n                mu_cs = float(raw_mom.mean())\n                sig_cs = float(raw_mom.std())\n                z = (\n                    ((raw_mom - mu_cs) / sig_cs).clip(-3.0, 3.0)\n                    if sig_cs > 0\n                    else raw_mom * 0\n                )\n                composite_score += z.fillna(0) * cw\n            score = composite_score[valid & composite_score.notna()]\n'''
          new='''            composite_score = pd.Series(0.0, index=prices.columns)\n            available_weight = pd.Series(0.0, index=prices.columns)\n            for w_period, cw in zip(WINDOWS, norm_w if norm_w else [0.2] * 5):\n                if cw <= 0:\n                    continue\n                sharpe, _ = _calendar_period_sharpe(\n                    prices, log_ret, start_idx, int(w_period)\n                )\n                raw_mom = sharpe\n\n                mu_cs = float(raw_mom.mean())\n                sig_cs = float(raw_mom.std(ddof=0))\n                z = ((raw_mom - mu_cs) / sig_cs).clip(-3.0, 3.0) if sig_cs > 0 else pd.Series(np.nan, index=raw_mom.index)\n                composite_score += z.fillna(0) * cw\n                available_weight += z.notna().astype(float) * cw\n            composite_score = composite_score.div(available_weight.replace(0.0, np.nan))\n            score = composite_score[valid & composite_score.notna()]\n'''
          if old not in t: raise SystemExit('backtester composite block not found')
          p.write_text(t.replace(old,new,1))
          PY
      - name: Verify full regression and compile
        run: |
          python -m pytest -q
          python -m compileall -q app.py src scripts
      - name: Publish source fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git commit -m "fix(v1): eliminate synthetic fills and stale methodology paths"
          git push origin HEAD:main
      - name: Trigger full validation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run v1-full-validation.yml --ref main
      - name: Self remove
        run: |
          git fetch origin main
          git reset --hard origin/main
          git rm .github/workflows/v1-hardening-once.yml
          git commit -m "chore(v1): remove second one-time repair workflow"
          git push origin HEAD:main
