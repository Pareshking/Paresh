name: Daily NSE Momentum Data Sync

on:
  schedule:
    # 15:30 UTC = 21:00 IST (9:00 PM IST) Monday to Friday (Trading Days)
    - cron: '30 15 * * 1-5'
  workflow_dispatch: # Allows manual 1-click execution anytime from GitHub Actions tab

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # A step may declare `uses` or `run`, never both. Having both made this
      # workflow file invalid, so GitHub failed it on every push and the
      # nightly schedule never fired -- 200 consecutive failed runs.
      - name: Restore price cache
        id: restore-price-cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/data_cache/
          key: price-data-${{ runner.os }}
          restore-keys: |
            price-data-

      - name: Report cache restore result
        run: |
          echo "Cache restore result: ${{ steps.restore-price-cache.outputs.cache-hit }}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Automated Daily Market Sync
        env:
          PYTHONPATH: .
        run: |
          python scripts/sync_data.py

      - name: Save price cache
        if: always()
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/data_cache/
          key: price-data-${{ runner.os }}

      - name: Commit and Push Updated Index & Classification Files
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A data/
          git diff --staged --quiet || (git commit -m "chore(data): automated daily NSE index & classification sync [skip ci]" && git push)

