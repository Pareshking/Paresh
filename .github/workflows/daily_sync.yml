name: Daily NSE Momentum Data Sync

on:
  schedule:
    # 17:30 UTC = 23:00 IST (11:00 PM IST) Monday to Friday (Trading Days).
    #
    # NSE publishes the PR bhavcopy -- the archive carrying market caps --
    # after 21:00 IST, and not at a fixed minute. The 22:00 IST slot fired at
    # 22:29 IST on 2026-08-18 and the zip was NOT there yet; the same file
    # fetched cleanly at 22:51. Running at 23:00 IST leaves the publication
    # window comfortably behind while staying on the same IST calendar day, so
    # recent_trading_days() still resolves "today" to the session just closed.
    #
    # GitHub also runs scheduled workflows on a best-effort queue and has been
    # consistently ~28 minutes late here, so the real firing is nearer 23:30
    # IST. That is slack in the right direction. The schedule remains a
    # request rather than a guarantee -- the AsOf dates in the footer are what
    # make a missed run visible.
    - cron: '30 17 * * 1-5'
  workflow_dispatch: # Allows manual 1-click execution anytime from GitHub Actions tab

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # A step may declare `uses` or `run`, never both. Having both made this
      # workflow file invalid, so GitHub failed it on every push and the
      # nightly schedule never fired -- 200 consecutive failed runs.
      #
      # The key must CHANGE every run. actions/cache treats an entry as
      # immutable: when the key already exists it skips the save outright --
      # "Cache hit occurred on the primary key price-data-Linux, not saving
      # cache", which this job logged on every run it ever made. The cached
      # frame was therefore frozen on the day it was first written, while the
      # incremental top-up had to re-fetch one more session for every day that
      # passed since. run_id makes each run write its own entry; restore-keys
      # falls back to the newest previous one, so the job still starts from
      # the freshest history available.
      - name: Restore price cache
        id: restore-price-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/data_cache/
          key: price-data-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            price-data-${{ runner.os }}-
            price-data-

      # cache-hit is an EXACT-key match, and the key now carries this run's id,
      # so it is false on every run by construction -- it would report "false"
      # while a perfectly good cache was restored. The matched key is the one
      # that answers the question actually being asked here: which run's
      # history did this one start from, and did it start from any at all.
      - name: Report cache restore result
        run: |
          MATCHED="${{ steps.restore-price-cache.outputs.cache-matched-key }}"
          if [ -n "$MATCHED" ]; then
            echo "Price cache restored from: $MATCHED"
          else
            echo "::warning::No price cache matched; this run rebuilds the history from scratch."
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Automated Daily Market Sync
        env:
          PYTHONPATH: .
        run: |
          python scripts/sync_data.py

      # Explicitly save, with the SAME rotating key the restore asked for, so
      # there is exactly one writer. Splitting restore from save also removes
      # the combined action's own post-job save, which used to fire alongside
      # this step and skip for the same reason.
      - name: Save price cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/data_cache/
          key: price-data-${{ runner.os }}-${{ github.run_id }}

      # Published as a release asset, not committed. At ~10.5 MB a daily commit
      # would add roughly 2.5 GB a year of git history to a repository against
      # GitHub's ~1 GB soft limit; a release asset is replaced in place and
      # carries none. Production seeds its empty /tmp cache from this in one
      # HTTPS GET instead of re-downloading two years from Yahoo.
      - name: Publish price snapshot
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SNAP="${{ github.workspace }}/data_cache/prices_snapshot.parquet"
          if [ ! -f "$SNAP" ]; then
            echo "::warning::No price snapshot was produced; skipping upload."
            exit 0
          fi
          ls -lh "$SNAP"
          # A single rolling tag. The release is created once and its asset
          # replaced every run, so there is exactly one snapshot to fetch and
          # no accumulation of stale ones.
          gh release view data-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create data-latest \
              --repo "$GITHUB_REPOSITORY" \
              --title "Latest data snapshots" \
              --notes "Rolling price history published by the daily sync. Replaced in place; not intended as a versioned release." \
              --latest=false
          cp "$SNAP" "${{ github.workspace }}/prices.parquet"
          gh release upload data-latest "${{ github.workspace }}/prices.parquet" \
            --repo "$GITHUB_REPOSITORY" --clobber
          echo "Uploaded prices.parquet to release data-latest."

      - name: Commit and Push Updated Index & Classification Files
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A data/
          if git diff --staged --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          git commit -m "chore(data): automated daily NSE index & classification sync [skip ci]"
          # Rebase before pushing, and retry. A plain push loses the ENTIRE
          # sync when anyone lands a commit on main during the two minutes this
          # job runs -- which happened on 2026-08-18: the run computed the
          # all-time-high snapshot, then died on "! [rejected] main -> main
          # (fetch first)" and threw the whole thing away.
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected on attempt $attempt; rebasing onto origin/main."
            git fetch origin main
            git rebase origin/main || {
              echo "Rebase hit a conflict in generated data; taking our copy."
              git checkout --ours -- data/ 2>/dev/null || true
              git add -A data/
              git rebase --continue || git rebase --abort
            }
            sleep $((attempt * 3))
          done
          echo "::error::Could not push the data sync after 5 attempts."
          exit 1

