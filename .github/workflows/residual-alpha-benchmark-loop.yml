name: Residual Alpha Benchmark Consistency Loop

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-current-main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Verify targeted residual-alpha and benchmark tests
        run: |
          python -m pytest -q \
            tests/test_residual_alpha_benchmark.py \
            tests/test_benchmark_consistency.py \
            tests/test_residual_alpha_alignment.py

      - name: Verify full test suite
        run: python -m pytest -q

      - name: Compile quantitative Python modules
        run: |
          python -m py_compile \
            src/engine/momentum.py \
            src/engine/backtester.py \
            src/ui/views/strategy_view.py \
            app.py
