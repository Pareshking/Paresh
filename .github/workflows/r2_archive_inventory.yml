name: R2 archive inventory

on:
  workflow_dispatch:
  schedule:
    - cron: "31 2 * * *"
  push:
    branches: [main]
    paths:
      - "scripts/r2_inventory.py"
      - "tests/test_r2_inventory.py"
      - ".github/workflows/r2_archive_inventory.yml"

permissions:
  contents: read

# Never let two runs of this workflow write the same objects at once.
concurrency:
  group: r2-publish-r2_archive_inventory
  cancel-in-progress: false

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Unit tests
        run: python -m pytest -q tests/test_r2_inventory.py
      - name: Live R2 inventory
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          PYTHONPATH: .
        run: python scripts/r2_inventory.py --json
      # Human-readable size table (read-only listing, no downloads): what the
      # archive stores, split into the last 30 days and older.
      - name: Storage size report
        if: always()
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          PYTHONPATH: .
        run: python scripts/r2_inventory.py | grep '^STORAGE' || true
