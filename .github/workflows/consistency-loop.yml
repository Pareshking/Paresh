name: Backtest Live Consistency Loop

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-and-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Patch backtest System-1 to calendar windows
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("src/engine/backtester.py")
          s = p.read_text()
          if "def _calendar_period_sharpe(" not in s:
              anchor = "from src.core.config import MOMENTUM_WINDOWS\n"
              helper = '''from src.core.config import MOMENTUM_WINDOWS\n\n\ndef _calendar_period_sharpe(\n    prices: pd.DataFrame,\n    log_returns: pd.DataFrame,\n    end_idx: int,\n    months: int,\n) -> tuple[pd.Series, int]:\n    """V1 period-scale Sharpe using the same calendar-window rule as the screener."""\n    dates = pd.DatetimeIndex(prices.index)\n    target = pd.Timestamp(dates[end_idx]).normalize() - pd.DateOffset(months=months)\n    start_idx = int(dates.searchsorted(target, side="left"))\n    if start_idx >= end_idx:\n        return pd.Series(np.nan, index=prices.columns), start_idx\n\n    p0 = prices.iloc[start_idx].clip(lower=0.01)\n    p1 = prices.iloc[end_idx].clip(lower=0.01)\n    log_return = np.log(p1 / p0)\n\n    window_lr = log_returns.iloc[start_idx + 1 : end_idx + 1]\n    n = window_lr.notna().sum()\n    daily_sd = window_lr.std()\n    period_vol = daily_sd * np.sqrt(n.astype(float))\n    sharpe = log_return / period_vol.replace(0, np.nan)\n    sharpe[n <= 1] = np.nan\n    return sharpe, start_idx\n'''
              if anchor not in s:
                  raise SystemExit("import anchor not found")
              s = s.replace(anchor, helper, 1)

          old = '''                mp = max(int(w_period * 0.8), 10)\n                sl = max(start_idx - w_period, 0)\n                p_w = prices.iloc[sl : start_idx + 1]\n                if len(p_w) < mp:\n                    continue\n\n                log_ret_period = np.log(\n                    p_w.iloc[-1].clip(lower=0.01) / p_w.iloc[0].clip(lower=0.01)\n                )\n                vol = log_ret.iloc[sl : start_idx + 1].std() * np.sqrt(w_period)\n                sharpe = log_ret_period / vol.replace(0, np.nan)\n\n                raw_mom = sharpe\n'''
          new = '''                sharpe, _ = _calendar_period_sharpe(\n                    prices, log_ret, start_idx, int(round(w_period / 21))\n                )\n                raw_mom = sharpe\n'''
          if old not in s:
              raise SystemExit("composite block not found")
          s = s.replace(old, new, 1)

          old2 = '''                sl = max(start_idx - w_period, 0)\n                p_w = prices.iloc[sl : start_idx + 1]\n                if len(p_w) < 10:\n                    continue\n                log_ret_p = np.log(\n                    p_w.iloc[-1].clip(lower=0.01) / p_w.iloc[0].clip(lower=0.01)\n                )\n                vol = log_ret.iloc[sl : start_idx + 1].std() * np.sqrt(w_period)\n                sharpe = log_ret_p / vol.replace(0, np.nan)\n                raw_mom = sharpe\n'''
          new2 = '''                sharpe, _ = _calendar_period_sharpe(\n                    prices, log_ret, start_idx, int(round(w_period / 21))\n                )\n                raw_mom = sharpe\n'''
          if old2 not in s:
              raise SystemExit("industry-relative block not found")
          s = s.replace(old2, new2, 1)
          p.write_text(s)
          PY
      - name: Add regression tests
        run: |
          cat > tests/test_backtester_calendar_consistency.py <<'PY'
          import numpy as np
          import pandas as pd

          from src.engine.backtester import _calendar_period_sharpe

          def test_backtester_12m_uses_calendar_start_not_252_rows():
              dates = pd.bdate_range("2025-08-01", "2026-08-14")
              prices = pd.DataFrame({"A": np.exp(np.linspace(5, 5.5, len(dates)))}, index=dates)
              log_returns = np.log(prices / prices.shift(1))
              score, start = _calendar_period_sharpe(prices, log_returns, len(prices) - 1, 12)
              assert prices.index[start] == pd.Timestamp("2025-08-14")
              assert np.isfinite(score["A"])
              assert len(prices) - 1 - start != 252

          def test_backtester_6m_uses_calendar_start():
              dates = pd.bdate_range("2025-08-01", "2026-08-14")
              prices = pd.DataFrame({"A": np.exp(np.linspace(5, 5.5, len(dates)))}, index=dates)
              log_returns = np.log(prices / prices.shift(1))
              _, start = _calendar_period_sharpe(prices, log_returns, len(prices) - 1, 6)
              target = pd.Timestamp("2026-08-14") - pd.DateOffset(months=6)
              assert prices.index[start] >= target

          def test_backtester_missing_return_observation_not_zero_filled():
              dates = pd.bdate_range("2026-01-01", "2026-04-30")
              prices = pd.DataFrame({"A": np.linspace(100, 130, len(dates))}, index=dates)
              prices.iloc[20, 0] = np.nan
              log_returns = np.log(prices / prices.shift(1))
              score, _ = _calendar_period_sharpe(prices, log_returns, len(prices) - 1, 3)
              assert np.isfinite(score["A"])
              assert pd.isna(log_returns.iloc[20, 0])
          PY
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Compile modified modules
        run: python -m py_compile src/engine/backtester.py
      - name: Run full test suite
        env:
          PYTHONPATH: .
        run: python -m pytest -q
      - name: Commit verified implementation and remove loop workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/consistency-loop.yml
          git add src/engine/backtester.py tests/test_backtester_calendar_consistency.py
          git commit -m "fix(v1): align backtest momentum windows with calendar screener"
          git push
