name: R2 Historical Bootstrap

on:
  workflow_dispatch:
  push:
    branches:
      - feat/r2-phase2-bootstrap

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download current validated release snapshots
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download data-latest             --repo "$GITHUB_REPOSITORY"             --pattern prices_full.parquet             --pattern screener_prices.parquet             --pattern prices.parquet             --pattern rankings.parquet

      - name: Bootstrap immutable R2 archive objects
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          PYTHONPATH: .
        run: |
          python scripts/r2_bootstrap.py             --release-tag data-latest             --pipeline-version "r2-bootstrap-${GITHUB_SHA}"

      - name: Verify bootstrap objects remain readable
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          PYTHONPATH: .
        run: |
          python - <<'PY'
          from src.storage.r2 import R2Archive, R2Config

          archive = R2Archive(R2Config.from_env())
          keys = list(archive.list_keys("archive/"))
          manifests = [key for key in keys if key.startswith("archive/manifests/")]
          print(f"ARCHIVE_OBJECTS={len(keys)}")
          print(f"MANIFEST_OBJECTS={len(manifests)}")
          if len(manifests) < 2:
              raise SystemExit("Bootstrap verification found too few archive manifests")
          print("R2 BOOTSTRAP READBACK=PASS")
          PY
