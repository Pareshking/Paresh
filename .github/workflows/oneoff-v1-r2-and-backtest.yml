name: One-off V1 R2 removal and backtest fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-and-test:
    if: ${{ !contains(github.event.head_commit.message, '[oneoff-v1-r2]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Apply V1 changes
        run: python scripts/oneoff_remove_r2_v1.py

      - name: Compile runtime Python
        run: |
          python -m compileall -q src app.py

      - name: Run test suite
        run: pytest -q

      - name: Verify no R2 remains in runtime V1
        run: |
          ! grep -RniE 'R²|R2|Sharpe ×' src/engine src/ui/views/ranking_view.py src/ui/views/backtest_view.py

      - name: Commit tested changes and remove one-off tooling
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f scripts/oneoff_remove_r2_v1.py .github/workflows/oneoff-v1-r2-and-backtest.yml
          git add -A
          git commit -m 'fix(v1): remove R2 and align monthly backtest [oneoff-v1-r2]'
          git push
