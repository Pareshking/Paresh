name: NSE closes to R2 and the release (seed)

# One-off (owner, 21 Nov 2026: "move closes.parquet to R2 now"): publishes the
# committed data/nse_prices/closes.parquet to R2 (nse/closes_2y) and the
# data-latest release (nse_closes.parquet), so the file can leave git without
# the app losing it. Runs when this file lands on main; from then on
# monthly_track_record.yml publishes each month's extension itself. Removed
# together with the committed file once a run is green (TODO S178).

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/nse_closes_publish.yml"
  workflow_dispatch:

permissions:
  contents: write   # the release upload

concurrency:
  group: r2-publish-nse-closes
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: .
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
      - run: pip install -r requirements.txt
      - name: Publish
        run: bash scripts/publish_nse_closes.sh
      # The published copies must be the committed bytes before the file leaves git.
      - name: Read both copies back and compare with the committed file
        run: |
          python - <<'PY'
          import io
          import sys

          import pandas as pd
          import requests

          from src.core.config import NSE_LONG_BASE_URL
          from src.loaders import app_source
          from src.loaders import nse_prices as npx

          committed = pd.read_parquet("data/nse_prices/closes.parquet")
          r2 = app_source.fetch_latest(npx.CLOSES_DATASET, "nse_closes")
          resp = requests.get(f"{NSE_LONG_BASE_URL}/{npx.CLOSES_ASSET}", timeout=60)
          release = resp.content if resp.status_code == 200 else None
          bad = []
          for label, body in (("R2", r2), ("release", release)):
              if body is None:
                  bad.append(f"{label}: not readable")
              elif not pd.read_parquet(io.BytesIO(body)).equals(committed):
                  bad.append(f"{label}: differs from the committed file")
              else:
                  print(f"{label}: identical to the committed file "
                        f"({committed.shape[0]} sessions x {committed.shape[1]} symbols, "
                        f"{committed.index.min().date()} to {committed.index.max().date()})")
          if bad:
              print("::error::" + "; ".join(bad))
              sys.exit(1)
          PY
