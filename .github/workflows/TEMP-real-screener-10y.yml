name: TEMP real Screener 10Y bootstrap validation

on:
  push:
    paths:
      - ".github/workflows/TEMP-real-screener-10y.yml"
  pull_request:

permissions:
  contents: write

concurrency:
  group: temp-screener-10y
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restore existing Screener store
        uses: actions/cache/restore@v4
        with:
          path: data_cache/
          key: temp-screener-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            screener-data-${{ runner.os }}-
      - name: Download current release store if cache is absent
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -s data_cache/screener_prices.parquet ]; then
            mkdir -p data_cache
            gh release download data-latest \
              --repo "$GITHUB_REPOSITORY" \
              --pattern "screener_prices.parquet" \
              --dir data_cache \
              --clobber
          fi
          test -s data_cache/screener_prices.parquet
      - name: Run real 10Y Screener bootstrap
        env:
          PYTHONPATH: .
          SCREENER_DELAY_S: "0.8"
        run: python scripts/screener_bootstrap_10y.py
      - name: Verify deep history
        run: |
          test -s data_cache/screener_prices.parquet
          ls -lh data_cache/screener_prices.parquet
      - name: Publish deep Screener history to R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          PYTHONPATH: .
        run: |
          python scripts/r2_publish.py \
            --path data_cache/screener_prices.parquet \
            --dataset prices/screener \
            --source screener \
            --key-root archive/prices/screener \
            --pipeline-version "temp-screener-10y-${{ github.sha }}" \
            --release-tag data-latest

# validation rerun
