name: Audit short history

on:
  push:
    branches: [audit/short-history-2026-10-08]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - run: pip install -r requirements.txt
      - name: Download canonical ranking
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release download data-latest --repo "$GITHUB_REPOSITORY" --pattern "rankings.parquet" --dir /tmp/ranking --clobber
      - name: Audit
        run: |
          python - <<'PY'
          import pandas as pd
          from src.loaders import price_source, nse_prices
          symbols = ["KISSHT","BAGMANE","CMRGREEN","VAML","VOGL","VISL","VEDPOWER"]
          store = price_source.fetch_screener_store()
          print("SCREENER_STORE_SHAPE=", None if store is None else store.shape)
          frames = price_source.ranking_frames(store, symbols, nse_prices.middle_close(symbols))
          assert frames is not None
          frame = frames.adj_close.reindex(columns=symbols)
          print("FINAL_FRAME_SHAPE=", frame.shape)
          print("FINAL_FRAME_FIRST=", frame.index.min())
          print("FINAL_FRAME_LAST=", frame.index.max())
          print("WEEKLY_FILL_REPORT=", frames.weekly_fill)
          for s in symbols:
              x=frame[s].dropna()
              print(f"RESULT {s} count={len(x)} first={x.index[0].date() if len(x) else None} last={x.index[-1].date() if len(x) else None}")
          print("RAW_SCREENER_COUNTS")
          raw=store.xs("Close",axis=1,level=-1).reindex(columns=symbols)
          for s in symbols:
              x=raw[s].dropna()
              print(f"RAW {s} count={len(x)} first={x.index[0].date() if len(x) else None} last={x.index[-1].date() if len(x) else None}")
          PY
