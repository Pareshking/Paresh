name: Investigate NSE raw rows (diagnostic)

# Prints NSE's raw rows around dated events for docs/TODO.md S25 and S44, which
# need R2 (unreachable from the Claude session). Read-only; runs on pull
# requests that touch it, and by hand.
on:
  pull_request:
    paths:
      - .github/workflows/investigate_raw.yml
      - scripts/investigate_raw.py
      - scripts/rights_face_values.py
      - src/loaders/nse_adjusted.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  investigate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
      - run: pip install -r requirements.txt
      - name: Print raw rows
        env:
          PYTHONPATH: .
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python scripts/investigate_raw.py
      # S108: every rights row whose face value the new rule changes, from
      # NSE's yearly lists on the release (read-only).
      - name: Rights rows whose face value the S108 rule changes
        env:
          PYTHONPATH: .
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p refs
          gh release download data-latest --repo "$GITHUB_REPOSITORY" --dir refs --pattern ref_nse_action_list_api_2008_2026.zip
          unzip -q -o -j refs/ref_nse_action_list_api_2008_2026.zip -d refs/actions
          python scripts/rights_face_values.py --actions refs/actions
