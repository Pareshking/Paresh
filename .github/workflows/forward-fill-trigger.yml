name: Forward-Fill Integrity Trigger

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  audit-fix-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Apply forward-fill integrity fix
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path("src/loaders/price_loader.py")
          s = p.read_text()
          old = "    out = out.ffill()\n    if symbols:\n"
          new = "    # Preserve security-specific NaNs; do not manufacture zero-return observations.\n    if symbols:\n"
          if old not in s:
              raise SystemExit("price_loader forward-fill block not found")
          p.write_text(s.replace(old, new, 1))

          p = Path("src/engine/momentum.py")
          s = p.read_text()
          old = "    cleaned = df.loc[~holidays]\n    return cleaned.ffill()\n"
          new = "    # Remove exchange-wide missing dates only; preserve stock-specific NaNs.\n    cleaned = df.loc[~holidays]\n    return cleaned\n"
          if old not in s:
              raise SystemExit("momentum holiday forward-fill block not found")
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Add regression tests
        run: |
          cat > tests/test_missing_data_integrity.py <<'PY'
          import numpy as np
          import pandas as pd

          from src.engine.momentum import clean_holidays
          from src.loaders.price_loader import _clean_price_df

          def test_security_specific_nan_is_not_forward_filled():
              idx = pd.bdate_range("2026-01-05", periods=4)
              raw = pd.DataFrame({"A": [100.0, np.nan, 110.0, 111.0]}, index=idx)
              cleaned = _clean_price_df(raw)
              assert pd.isna(cleaned.loc[idx[1], "A"])
              assert cleaned.loc[idx[2], "A"] == 110.0

          def test_security_specific_nan_does_not_create_zero_return():
              idx = pd.bdate_range("2026-01-05", periods=4)
              raw = pd.DataFrame({"A": [100.0, np.nan, 110.0, 111.0]}, index=idx)
              returns = _clean_price_df(raw)["A"].pct_change(fill_method=None)
              assert pd.isna(returns.iloc[1])
              assert not np.isclose(returns.iloc[2], 0.0)

          def test_exchange_wide_missing_date_is_removed():
              idx = pd.bdate_range("2026-01-05", periods=4)
              raw = pd.DataFrame(
                  {f"S{i}": [100.0, np.nan, 102.0, 103.0] for i in range(10)},
                  index=idx,
              )
              cleaned = clean_holidays(raw)
              assert idx[1] not in cleaned.index

          def test_trailing_all_nan_rows_removed_but_internal_nan_survives():
              idx = pd.bdate_range("2026-01-05", periods=5)
              raw = pd.DataFrame({"A": [100.0, np.nan, 110.0, 111.0, np.nan]}, index=idx)
              cleaned = _clean_price_df(raw)
              assert idx[-1] not in cleaned.index
              assert pd.isna(cleaned.loc[idx[1], "A"])
          PY

      - name: Run targeted tests
        run: python -m pytest -q tests/test_missing_data_integrity.py

      - name: Run full test suite
        run: python -m pytest -q

      - name: Compile changed modules
        run: python -m py_compile src/loaders/price_loader.py src/engine/momentum.py

      - name: Commit verified fix and remove temporary workflows
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/loaders/price_loader.py src/engine/momentum.py tests/test_missing_data_integrity.py
          git rm .github/workflows/forward-fill-integrity-loop.yml .github/workflows/forward-fill-trigger.yml
          git commit -m "fix: preserve security-specific missing prices"
          git push origin main
