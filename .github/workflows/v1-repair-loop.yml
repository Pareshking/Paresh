name: V1 Repair Loop

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

env:
  PYTHONPATH: .

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: pip install -r requirements.txt pytest

      - name: Apply objective V1 hardening repairs
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')

          # 1. Canonicalize the legacy MomentumEngine entry point onto the
          # calendar-period System-1 engine so no caller can silently revive
          # the old fixed-row implementation.
          p = root / 'src/engine/momentum.py'
          text = p.read_text(encoding='utf-8')
          old = '''        if self.momentum_scores is None:\n            self.calculate_sharpe_momentum()\n'''
          new = '''        if self.momentum_scores is None:\n            from src.engine.calendar_momentum import apply_calendar_momentum\n            apply_calendar_momentum(self)\n'''
          if old in text:
              text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')

          # 2. Cross-sectional normalization uses population dispersion because
          # the full valid cross-section is the population being standardized.
          text = p.read_text(encoding='utf-8')
          text = text.replace('clean.std() == 0', 'clean.std(ddof=0) == 0')
          text = text.replace('float(clean.mean()), float(clean.std())', 'float(clean.mean()), float(clean.std(ddof=0))')
          text = text.replace('float(clean.std())', 'float(clean.std(ddof=0))')
          p.write_text(text, encoding='utf-8')

          # 3. Remove synthetic zero contributions from missing calendar factors.
          p = root / 'src/engine/calendar_momentum.py'
          text = p.read_text(encoding='utf-8')
          text = text.replace(
              '            if len(clean) < 3 or float(clean.std(ddof=0)) == 0.0:\n                z_rows.append(pd.Series(0.0, index=score.columns))\n                continue\n',
              '            if len(clean) < 3 or float(clean.std(ddof=0)) == 0.0:\n                z_rows.append(pd.Series(np.nan, index=score.columns))\n                continue\n',
          )
          text = text.replace(
              '            z = (clipped - float(clipped.mean())) / (clipped_std + 1e-12)\n            z_rows.append(z.reindex(score.columns).fillna(0.0))\n',
              '            z = (clipped - float(clipped.mean())) / (clipped_std + 1e-12)\n            z_rows.append(z.reindex(score.columns))\n',
          )
          p.write_text(text, encoding='utf-8')

          # 4. Residual-alpha benchmark alignment must never forward-fill a
          # benchmark return. Compute stock/beta/alpha only on paired valid data.
          p = root / 'src/engine/momentum.py'
          text = p.read_text(encoding='utf-8')
          text = text.replace(
              '            mkt_ret = pd.to_numeric(benchmark_returns, errors="coerce").reindex(daily_ret.index).ffill()\n',
              '            mkt_ret = pd.to_numeric(benchmark_returns, errors="coerce").reindex(daily_ret.index)\n',
          )
          old = '''        ret_w = daily_ret.iloc[start:]\n        mkt_ret_w = mkt_ret.iloc[start:]\n        mkt_var = float(mkt_ret_w.var())\n\n        if mkt_var <= 1e-12 or np.isnan(mkt_var) or len(mkt_ret_w.dropna()) < 30:\n            ranks = pd.Series(np.nan, index=self.prices.columns)\n            self.residual_ranks = ranks\n            return ranks\n\n        covs = ret_w.apply(lambda col: col.cov(mkt_ret_w))\n        betas = covs / mkt_var\n        stock_mean = ret_w.mean()\n        mkt_mean = float(mkt_ret_w.mean())\n        alpha_ann = (stock_mean - betas * mkt_mean) * 252\n\n        if months is None:\n            min_history = min(window, 63)\n        else:\n            min_history = max(2, len(ret_w) // 4)\n        alpha_ann = alpha_ann.where(self._valid_counts >= min_history, np.nan)\n        ranks = alpha_ann.rank(ascending=False, method="min")\n'''
          new = '''        mkt_ret_w = mkt_ret.iloc[start:]\n        ranks = pd.Series(np.nan, index=self.prices.columns, dtype=float)\n        for sym in self.prices.columns:\n            pair = pd.concat([daily_ret[sym].iloc[start:], mkt_ret_w], axis=1).dropna()\n            if len(pair) < 30:\n                continue\n            stock_r = pair.iloc[:, 0]\n            bench_r = pair.iloc[:, 1]\n            mkt_var = float(bench_r.var())\n            if mkt_var <= 1e-12 or not np.isfinite(mkt_var):\n                continue\n            beta = float(stock_r.cov(bench_r)) / mkt_var\n            alpha_ann = (float(stock_r.mean()) - beta * float(bench_r.mean())) * 252\n            ranks.loc[sym] = alpha_ann\n\n        ranks = ranks.rank(ascending=False, method="min")\n'''
          if old not in text:
              raise SystemExit('Residual-alpha block was not found; refusing partial repair')
          text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')

          # 5. Backtester Industry-Relative branch was unreachable because the
          # composite predicate included its own method name. Make the branch
          # reachable and enforce leave-one-out peer means.
          p = root / 'src/engine/backtester.py'
          text = p.read_text(encoding='utf-8')
          text = text.replace(
              '        or "Industry-Relative" in ranking_method\n',
              '',
              1,
          )
          old = '''            ind_scores: dict[str, list[float]] = {}\n            for sym, sc in composite_score.items():\n                ind_scores.setdefault(ind_map.get(sym, "Other"), []).append(sc)\n            ind_means = {k: np.nanmean(v) for k, v in ind_scores.items()}\n            ind_rel = composite_score - composite_score.index.map(\n                lambda s: ind_means.get(ind_map.get(s, "Other"), 0)\n            )\n            score = ind_rel[valid & ind_rel.notna()]\n'''
          new = '''            score_df = pd.DataFrame({\n                "Symbol": composite_score.index,\n                "Score": composite_score.values,\n                "Industry": [ind_map.get(s, "Other") for s in composite_score.index],\n            })\n            peer_sum = score_df.groupby("Industry")["Score"].transform("sum", min_count=1) - score_df["Score"]\n            peer_count = score_df.groupby("Industry")["Score"].transform("count") - score_df["Score"].notna().astype(int)\n            peer_mean = peer_sum.div(peer_count.replace(0, np.nan))\n            ind_rel = score_df["Score"] - peer_mean\n            ind_rel.index = score_df["Symbol"]\n            score = ind_rel[valid & ind_rel.notna()]\n'''
          if old not in text:
              raise SystemExit('Backtester industry-relative block was not found; refusing partial repair')
          text = text.replace(old, new, 1)
          text = text.replace('.fillna(0.0)', '.dropna(how="any")')
          p.write_text(text, encoding='utf-8')

          # 6. Portfolio risk/covariance calculations must not turn missing
          # observations into synthetic zero returns.
          p = root / 'src/engine/portfolio.py'
          text = p.read_text(encoding='utf-8')
          text = text.replace('clean = returns_df.fillna(0.0)', 'clean = returns_df.dropna(how="any")')
          text = text.replace('.iloc[-window:].fillna(0.0)', '.iloc[-window:].dropna(how="any")')
          text = text.replace('.iloc[-126:].fillna(0.0)', '.iloc[-126:].dropna(how="any")')
          text = text.replace('.iloc[-window:].fillna(0.0)', '.iloc[-window:].dropna(how="any")')
          p.write_text(text, encoding='utf-8')

          # 7. Streamlit guide text must describe the actual current System-1
          # methodology, not the removed Pearson/R-squared formulation.
          p = root / 'src/ui/views/guide_view.py'
          text = p.read_text(encoding='utf-8')
          text = text.replace(
              'Each window calculates annualized log-Sharpe multiplied by Pearson  regression score (Sharpe) to reward persistent geometric compounding over erratic single-day spike noise.',
              'Each window calculates the approved period risk-adjusted momentum statistic: log return divided by period volatility using all valid daily observations in the calendar-defined horizon.',
          )
          text = text.replace(
              'Single Lookback Window</strong>: Evaluates purely 1 isolated timeframe (e.g. only 3M / 63 days or only 6M / 126 days).',
              'Single Lookback Window</strong>: Evaluates one isolated calendar timeframe (e.g. 3M or 6M).',
          )
          text = text.replace(
              'Walk-forward monthly (21D) rebalancing',
              'Walk-forward monthly calendar rebalancing',
          )
          p.write_text(text, encoding='utf-8')

          # 8. Remove stale R2 columns/formatting from the UI rendering layer.
          p = root / 'src/ui/theme.py'
          text = p.read_text(encoding='utf-8')
          text = re.sub(r'\n    "3M R2": "\{:\.2f\}",\n    "6M R2": "\{:\.2f\}",', '', text)
          text = text.replace('r2_3m = row.get("3M R2")\n        r2_3m_str = (\n            f"{float(r2_3m):.2f}"\n            if pd.notna(r2_3m) and isinstance(r2_3m, (int, float))\n            else "—"\n        )\n\n', '')
          text = text.replace('r2_6m = row.get("6M R2")\n        r2_6m_str = (\n            f"{float(r2_6m):.2f}"\n            if pd.notna(r2_6m) and isinstance(r2_6m, (int, float))\n            else "—"\n        )\n\n', '')
          text = text.replace(' or "r2" in col_l', '')
          text = text.replace('                    "R2",\n', '')
          text = text.replace('                        "R2",\n', '')
          text = text.replace('<td class="td-num">{r2_3m_str}</td>', '')
          text = text.replace('<td class="td-num">{r2_6m_str}</td>', '')
          text = text.replace('<th>3M R²</th>', '')
          text = text.replace('<th>6M R²</th>', '')
          p.write_text(text, encoding='utf-8')

          # 9. Remove R2-only display code from any remaining runtime file,
          # while preserving the historical audit tracker and regression test.
          for path in [root / 'app.py', *((root / 'src').rglob('*.py'))]:
              if path == root / 'src/ui/theme.py':
                  continue
              t = path.read_text(encoding='utf-8')
              if any(tok in t for tok in ('R²', 'R^2', 'R2', 'Sharpe ×')):
                  print(f'STALE_RUNTIME_R2_REMAINS={path}')

          # 10. Keep the market-regime documentation consistent with the
          # canonical benchmark; no undocumented Nifty-50 fallback.
          p = root / 'src/loaders/price_loader.py'
          text = p.read_text(encoding='utf-8')
          text = text.replace(
              '    Falls back to Nifty 50 (^NSEI) if Nifty 500 (^CRSLDX) is unavailable.\n',
              '    Uses the canonical V1 benchmark passed by the caller (default ^CRSLDX).\n',
          )
          p.write_text(text, encoding='utf-8')
          PY

      - name: Run regression suite before publishing repairs
        run: python -m pytest -q

      - name: Compile repaired application
        run: python -m compileall -q app.py src scripts

      - name: Publish verified repairs
        run: |
          if git diff --quiet; then
            echo "No repair changes required"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src tests docs README.md .github/workflows/v1-repair-loop.yml
            git commit -m "fix(v1): harden quantitative and runtime paths"
            git push origin HEAD:main
          fi

      - name: Trigger full validation on repaired main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run v1-full-validation.yml --ref main

      - name: Remove one-time repair workflow
        run: |
          git fetch origin main
          git checkout main
          git reset --hard origin/main
          if [ -f .github/workflows/v1-repair-loop.yml ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git rm .github/workflows/v1-repair-loop.yml
            git commit -m "chore(v1): remove one-time repair workflow"
            git push origin HEAD:main
          fi
