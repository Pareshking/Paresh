name: Residual Alpha Integrity Loop

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Fix residual-alpha paired observations
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("src/engine/backtester.py")
          s = p.read_text()
          old = '''            valid_mkt = mkt_ret.notna()\n            mkt_ret = mkt_ret.loc[valid_mkt]\n            stk_ret = stk_ret.loc[valid_mkt]\n            if len(mkt_ret) >= 30 and float(mkt_ret.var()) > 0:\n                cov_m = stk_ret.apply(lambda col: col.cov(mkt_ret))\n                var_m = float(mkt_ret.var())\n                beta = cov_m / var_m\n                alpha_res = (stk_ret.mean() * 252) - (beta * (float(mkt_ret.mean()) * 252))\n                score = alpha_res[valid & alpha_res.notna()]\n            else:\n                score = pd.Series(np.nan, index=prices.columns)\n'''
          new = '''            # CAPM alpha must use paired valid stock/benchmark observations.\n            # Do not let a stock's missing observations enter its mean/beta on a\n            # different sample from the benchmark.\n            valid_mkt = mkt_ret.notna()\n            mkt_ret = mkt_ret.loc[valid_mkt]\n            stk_ret = stk_ret.loc[valid_mkt]\n            if len(mkt_ret) >= 30 and float(mkt_ret.var()) > 0:\n                alpha_res = pd.Series(np.nan, index=prices.columns, dtype=float)\n                for sym in stk_ret.columns:\n                    pair = pd.concat([stk_ret[sym], mkt_ret], axis=1).dropna()\n                    if len(pair) < 30:\n                        continue\n                    stock_r = pair.iloc[:, 0]\n                    bench_r = pair.iloc[:, 1]\n                    bench_var = float(bench_r.var())\n                    if bench_var <= 0:\n                        continue\n                    beta_i = float(stock_r.cov(bench_r)) / bench_var\n                    alpha_res.loc[sym] = (float(stock_r.mean()) - beta_i * float(bench_r.mean())) * 252\n                score = alpha_res[valid & alpha_res.notna()]\n            else:\n                score = pd.Series(np.nan, index=prices.columns)\n'''
          if old not in s:
              raise SystemExit("Expected residual-alpha block not found")
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Add residual-alpha alignment tests
        run: |
          cat > tests/test_residual_alpha_alignment.py <<'PY'
          import numpy as np
          import pandas as pd

          def paired_alpha(stock, benchmark):
              pair = pd.concat([stock, benchmark], axis=1).dropna()
              if len(pair) < 30:
                  return np.nan
              y, x = pair.iloc[:, 0], pair.iloc[:, 1]
              var = float(x.var())
              if var <= 0:
                  return np.nan
              beta = float(y.cov(x)) / var
              return (float(y.mean()) - beta * float(x.mean())) * 252

          def test_missing_stock_observations_are_excluded_from_both_beta_and_mean():
              idx = pd.bdate_range("2025-01-01", periods=80)
              benchmark = pd.Series(np.linspace(0.001, 0.003, len(idx)), index=idx)
              stock = 0.5 * benchmark + 0.001
              stock = pd.Series(stock, index=idx)
              stock.iloc[[10, 20, 21, 45]] = np.nan
              got = paired_alpha(stock, benchmark)
              expected = paired_alpha(stock.dropna(), benchmark.loc[stock.dropna().index])
              assert np.isclose(got, expected, equal_nan=True)

          def test_insufficient_paired_observations_returns_nan():
              idx = pd.bdate_range("2025-01-01", periods=40)
              benchmark = pd.Series(0.002, index=idx)
              stock = pd.Series(0.003, index=idx)
              stock.iloc[:15] = np.nan
              assert np.isnan(paired_alpha(stock, benchmark))
          PY
      - name: Run targeted tests
        run: python -m pytest -q tests/test_residual_alpha_alignment.py
      - name: Compile
        run: python -m py_compile src/engine/backtester.py
      - name: Run full test suite
        run: python -m pytest -q
      - name: Commit verified fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/engine/backtester.py tests/test_residual_alpha_alignment.py
          git rm .github/workflows/residual-alpha-integrity-loop.yml
          git commit -m "fix: align residual alpha stock and benchmark observations"
          git push origin main
