name: V1 Recent 6M Month Start
on:
  workflow_dispatch:
  push:
    branches: [Sandbox]
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run recent 6M month-start research
        run: python research/v1_recent6m_monthstart.py
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: v1-recent6m-monthstart-results
          path: research/outputs/v1_recent6m_monthstart_*.csv
          retention-days: 14
