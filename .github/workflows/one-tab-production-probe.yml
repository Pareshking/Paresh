name: V1 One-Tab Production Probe

on:
  workflow_dispatch:
  push:
    paths:
      - scripts/production_one_tab_probe.py
      - .github/workflows/one-tab-production-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install Playwright
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Probe one production tab
        run: python scripts/production_one_tab_probe.py
      - name: Upload probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v1-one-tab-production-probe
          path: artifacts/one_tab_probe/
          if-no-files-found: warn
