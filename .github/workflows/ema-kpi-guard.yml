name: Harden EMA KPI

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Patch EMA KPI handling
        run: |
          python - <<'PY'
          from pathlib import Path

          util = Path("src/ui/ema_utils.py")
          util.parent.mkdir(parents=True, exist_ok=True)
          util.write_text('''import pandas as pd\n\n\ndef count_above_ema(rank_df: pd.DataFrame) -> int:\n    """Count stocks above 50 EMA without failing on duplicate/unexpected columns."""\n    ema_col = rank_df.get("Above 50 EMA")\n    if ema_col is None:\n        return 0\n    if isinstance(ema_col, pd.DataFrame):\n        ema_col = ema_col.iloc[:, -1]\n    if not isinstance(ema_col, pd.Series):\n        ema_col = pd.Series(ema_col, index=rank_df.index)\n    normalized = ema_col.astype("string").str.strip().str.casefold()\n    return int(normalized.isin({"true", "1", "✅"}).sum())\n''')

          p = Path("app.py")
          text = p.read_text()
          import_anchor = "from src.ui.components import (\n"
          if "from src.ui.ema_utils import count_above_ema\n" not in text:
              text = text.replace(import_anchor, "from src.ui.ema_utils import count_above_ema\n" + import_anchor, 1)

          start = text.index("# Defensive handling for duplicate column names.")
          end = text.index("pct_above_ema =", start)
          replacement = "above_ema = count_above_ema(rank_df)\n"
          text = text[:start] + replacement + text[end:]
          p.write_text(text)
          PY
      - name: Add regression tests
        run: |
          cat > tests/test_ema_kpi.py <<'PY'
          import pandas as pd
          from src.ui.ema_utils import count_above_ema

          def test_count_above_ema_normal_series():
              df = pd.DataFrame({"Above 50 EMA": ["True", "False", "✅", "1"]})
              assert count_above_ema(df) == 3

          def test_count_above_ema_duplicate_columns():
              df = pd.DataFrame([["False", "True"], ["False", "False"]], columns=["Above 50 EMA", "Above 50 EMA"])
              assert count_above_ema(df) == 1

          def test_count_above_ema_missing_column():
              assert count_above_ema(pd.DataFrame({"Symbol": ["A", "B"]})) == 0
          PY
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Run full test suite
        env:
          PYTHONPATH: .
        run: python -m pytest -q
      - name: Commit verified fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app.py src/ui/ema_utils.py tests/test_ema_kpi.py .github/workflows/ema-kpi-guard.yml
          git diff --cached --quiet || git commit -m "fix(v1): harden EMA KPI handling"
          git push
