name: NSE reference feeds sync

# Daily copy of NSE's ticker-change, name-change, listed-equities and corporate-action feeds into
# data/reference/nse/. It records what is new and which of it touches an index member
# (data/reference/nse/CHANGES.json, ::warning:: lines in the log). It never edits the membership history:
# a rename or a demerger needs a decision. NSE sometimes refuses cloud runners, so the script retries and
# FAILS the job (visible through the scheduled-failure alert) rather than overwrite good data with nothing.
# See nse_index_rebuild/FEEDS.md. GitHub's schedule queue can be hours late; nothing here depends on the minute.
on:
  schedule:
    - cron: '45 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nse-reference-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - run: pip install requests

      - name: Fetch NSE reference feeds
        run: python scripts/sync_nse_reference.py

      # NSE's trading-holiday list (owner, 15 Nov 2026: "We don't know NSE calendar for
      # even 2027"). NSE posts next year's list in December; this takes it in the night
      # it appears, never rewrites a past date, and warns while a needed year is missing.
      # A refused fetch is a warning, not a red sync: yesterday's list stays in force.
      - name: Fetch NSE's holiday list
        run: python scripts/sync_nse_holidays.py || echo "::warning::NSE's holiday list could not be fetched; the committed list is used."

      # Today's index lists from two NSE hosts against data/membership_history.json, recorded daily in
      # data/reference/nse/anchor_checks.jsonl (protocol gate G4: agreement on separate days). The snapshot below is
      # committed even if this step fails, and a failed fetch still turns the run red.
      - name: Check the history's current lists against NSE's published lists
        run: python scripts/check_index_anchor.py

      # Every NSE Indices notice since the Nifty 1000's launch (12 Nov 2026), read for what it says about the
      # Nifty 1000 and checked against its history (S196: tracked like the other indices). Ledger:
      # data/reference/nse/nifty1000_notices.json, committed with the snapshot below.
      - name: Read NSE's notices for the Nifty 1000
        run: |
          sudo apt-get install -y -qq poppler-utils >/dev/null
          python scripts/nifty1000_notices.py

      - name: Commit and push the snapshot
        if: ${{ !cancelled() }}
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A data/reference/nse/
          if git diff --staged --quiet; then
            echo "No reference-feed changes to commit."
            exit 0
          fi
          git commit -m "chore(data): NSE reference feeds sync [skip ci]"
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected on attempt $attempt; rebasing onto origin/main."
            git fetch origin main
            git rebase origin/main || {
              # In a rebase --theirs is the commit being replayed, i.e. this run's snapshot.
              git checkout --theirs -- data/reference/nse/ 2>/dev/null || true
              git add -A data/reference/nse/
              GIT_EDITOR=true git rebase --continue || git rebase --abort
            }
            sleep $((attempt * 3))
          done
          echo "::error::Could not push the reference-feed snapshot after 5 attempts."
          exit 1
