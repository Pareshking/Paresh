name: Canonical parity gate

# Every representation of the canonical account must keep agreeing: Portfolio,
# Actions and Backtest books, the frozen ledger, the pinned config it was struck
# under, the hard 5% / 40% caps, Actions' planner and the research defaults.
# scripts/canonical_parity_check.py runs the real code on the published data
# and fails on any disagreement. Owner, 2026-10-02.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # New data can break agreement as surely as new code: check after each sync.
  workflow_run:
    workflows: [Daily NSE Momentum Data Sync, Monthly Track Record Freeze]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

# Superseded PR runs are cancelled: only the PR's current head counts (S141,
# 16 Nov 2026: 61 full-validation PR runs, 242 min, were still running when a
# newer push reached their branch). Pushes, schedules and chains are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  parity:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
      - run: pip install -r requirements.txt
      - name: Canonical parity check
        run: python scripts/canonical_parity_check.py --report parity_report.json
      - name: Keep the parity report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: canonical-parity-report
          retention-days: 14
          path: parity_report.json
          if-no-files-found: warn
