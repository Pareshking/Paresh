name: Calendar Period Test

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  test:
    if: ${{ !contains(github.event.head_commit.message, '[calendar-migration]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt pytest
      - name: Apply calendar-period consistency changes
        run: python scripts/apply_calendar_consistency.py
      - name: Run full test suite
        run: python -m pytest -q
      - name: Commit tested source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/engine/momentum.py src/ui/views/strategy_view.py app.py
          git diff --cached --quiet || git commit -m "[calendar-migration] Apply calendar periods across period-based metrics"
          git push
