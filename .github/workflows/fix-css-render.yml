name: One-time CSS render fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: >-
      github.event.head_commit.message != 'fix(ui): render custom CSS as HTML' &&
      github.event.head_commit.message != 'chore: remove temporary CSS fix workflow'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch CSS injection
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/ui/theme.py')
          text = path.read_text(encoding='utf-8')

          old = '''    st.markdown(\n        """\n        <link rel="preconnect"'''
          new = '''    st.markdown(\n        clean_html("""\n        <link rel="preconnect"'''

          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one CSS markdown opener, found {text.count(old)}')
          if text.count(new) != 0:
              raise SystemExit('CSS opener is already patched')

          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          print('Patched src/ui/theme.py')
          PY

      - name: Validate
        run: |
          python -m py_compile src/ui/theme.py
          python - <<'PY'
          from pathlib import Path
          text = Path('src/ui/theme.py').read_text(encoding='utf-8')
          assert text.count('clean_html("""') == 1
          assert text.count('unsafe_allow_html=True') >= 1
          print('CSS injection validation passed')
          PY

      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/ui/theme.py
          git commit -m 'fix(ui): render custom CSS as HTML'
          git push origin main
