name: NSE indices (every index, daily)

# Every index NSE publishes in its daily all-indices file, with its history from
# 21 Feb 2012, kept in R2 (S168; owner, 21 Nov 2026: "Download full history once
# for all and let daily run update daily data quickly"). One request a night adds
# the new session; the first run is dispatched by hand with backfill: true.

on:
  workflow_dispatch:
    inputs:
      backfill:
        description: "Build the store from 21 Feb 2012 when none is published (about 2 hours, once)"
        type: boolean
        default: false
  schedule:
    # 19:40 IST every day: NSE posts the file in the evening; weekend sessions
    # (Muhurat, budget days) are asked for too, and a day without one is a 404.
    - cron: "10 14 * * *"

permissions:
  contents: read

concurrency:
  group: r2-publish-nse-indices
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
      - run: pip install -r requirements.txt pytest
      - name: Collector tests
        run: pytest -q tests/test_nse_indices.py
      - name: Add the new sessions (refuses to change a stored close)
        run: |
          python scripts/collect_nse_indices.py --store nse_indices.parquet --fetch --from-r2 \
            ${{ inputs.backfill && '--backfill' || '' }}
      - name: Publish to R2
        run: |
          python scripts/r2_publish.py \
            --path nse_indices.parquet \
            --dataset indices/nse_close_all \
            --source nse_ind_close_all \
            --key-root archive/indices/nse_close_all \
            --pipeline-version "nse_indices_v1" \
            --release-tag data-latest
      - name: Audit the published store
        run: |
          python scripts/r2_audit.py --dataset indices/nse_close_all --as-of \
            "$(python -c 'import pandas as pd; print(pd.read_parquet("nse_indices.parquet")["date"].max().date())')"
