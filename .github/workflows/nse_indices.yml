name: NSE indices (every index, daily)

# Every index NSE publishes in its daily all-indices file, with its history from
# 21 Feb 2012, kept in R2 (S168; owner, 21 Nov 2026: "Download full history once
# for all and let daily run update daily data quickly"). One request a night adds
# the new session; the first run is dispatched by hand with backfill: true.
# The app reads a copy in the repository (S170): data/nse_indices_history.parquet,
# frozen, and data/nse_indices_recent.csv, the sessions after it, rewritten here.

on:
  workflow_dispatch:
    inputs:
      until:
        description: "Backfill in batches: last day to fetch (e.g. 2015-12-31); empty = up to today. Each batch publishes to R2 and the next continues from it"
        type: string
        default: ""
      backfill:
        description: "Build the store from 21 Feb 2012 when none is published (about 2 hours, once)"
        type: boolean
        default: false
  schedule:
    # 19:40 IST every day: NSE posts the file in the evening; weekend sessions
    # (Muhurat, budget days) are asked for too, and a day without one is a 404.
    - cron: "10 14 * * *"

permissions:
  # Writes the app's copy (data/nse_indices_recent.csv) back to main.
  contents: write

concurrency:
  group: r2-publish-nse-indices
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
      - run: pip install -r requirements.txt pytest
      - name: Collector tests
        run: pytest -q tests/test_nse_indices.py
      - name: Add the new sessions (refuses to change a stored close)
        run: |
          python scripts/collect_nse_indices.py --store nse_indices.parquet --fetch --from-r2 \
            ${{ inputs.backfill && '--backfill' || '' }} --until "${{ inputs.until }}"
      - name: Publish to R2
        run: |
          python scripts/r2_publish.py \
            --skip-if-published \
            --path nse_indices.parquet \
            --dataset indices/nse_close_all \
            --source nse_ind_close_all \
            --key-root archive/indices/nse_close_all \
            --pipeline-version "nse_indices_v1" \
            --release-tag data-latest
      - name: Audit the published store
        run: |
          python scripts/r2_audit.py --dataset indices/nse_close_all --as-of \
            "$(python -c 'import pandas as pd; print(pd.read_parquet("nse_indices.parquet")["date"].max().date())')"
      # A batch that stops before today holds no session after the frozen history file,
      # and writing the app's copy from it would empty that copy.
      - name: Write the app's copy (sessions after the frozen history file)
        if: ${{ !inputs.until }}
        run: python scripts/export_nse_indices_compact.py --store nse_indices.parquet
      - name: Commit the app's copy
        if: ${{ !inputs.until }}
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/nse_indices_recent.csv
          if git diff --staged --quiet; then
            echo "Unchanged."
            exit 0
          fi
          git commit -m "chore(data): NSE indices, latest sessions [skip ci]"
          for i in 1 2 3 4 5; do
            if git push; then echo "Pushed."; exit 0; fi
            echo "Push failed (attempt $i); rebasing onto origin/main."
            git fetch origin main
            git rebase origin/main || { git rebase --abort; exit 1; }
            sleep $((i * 5))
          done
          exit 1
