name: 2010 PIT monthly ranking audit

on:
  workflow_dispatch:
    inputs:
      pit_membership_json_url:
        description: "HTTPS URL to verified Nifty 500 PIT history JSON (baseline + dated changes)"
        required: true
        type: string
      tradebook_csv_url:
        description: "Optional HTTPS URL to tradebook CSV (blank for rankings only)"
        required: false
        type: string
        default: ""
      price_release_tag:
        description: "Release containing nse_long_close.parquet"
        required: true
        type: string
        default: "data-latest"

permissions:
  contents: read

concurrency:
  group: pit-2010-monthly-ranking-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Parquet reader
        run: python -m pip install --upgrade pip pandas numpy pyarrow
      - name: Download historical price artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.price_release_tag }}
        run: |
          mkdir -p input output
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern nse_long_close.parquet --dir input
          test -s input/nse_long_close.parquet
      - name: Download PIT membership history
        env:
          INPUT_URL: ${{ inputs.pit_membership_json_url }}
        run: |
          python - <<'PY'
          import os
          from urllib.request import Request, urlopen
          url=os.environ["INPUT_URL"].strip()
          if not url.startswith("https://"): raise SystemExit("Membership URL must use HTTPS")
          with urlopen(Request(url,headers={"User-Agent":"Paresh-PIT-audit/1.0"}),timeout=90) as r: b=r.read(100_000_001)
          if len(b)>100_000_000: raise SystemExit("Membership file over 100 MB")
          open("input/pit_membership.json","wb").write(b)
          PY
      - name: Download tradebook if supplied
        if: ${{ inputs.tradebook_csv_url != '' }}
        env:
          INPUT_URL: ${{ inputs.tradebook_csv_url }}
        run: |
          python - <<'PY'
          import os
          from urllib.request import Request, urlopen
          url=os.environ["INPUT_URL"].strip()
          if not url.startswith("https://"): raise SystemExit("Tradebook URL must use HTTPS")
          with urlopen(Request(url,headers={"User-Agent":"Paresh-PIT-audit/1.0"}),timeout=90) as r: b=r.read(100_000_001)
          if len(b)>100_000_000: raise SystemExit("Tradebook file over 100 MB")
          open("input/tradebook.csv","wb").write(b)
          PY
      - name: Calculate monthly rankings
        run: |
          args=(--prices input/nse_long_close.parquet --membership input/pit_membership.json --out output)
          if [ -s input/tradebook.csv ]; then args+=(--tradebook input/tradebook.csv); fi
          python scripts/audit_2010_monthly_rankings.py "${args[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: 2010-pit-monthly-ranking-audit
          path: output/
          if-no-files-found: error
          retention-days: 30
