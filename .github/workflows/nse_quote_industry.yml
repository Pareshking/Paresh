name: NSE quote industry (one-off check)

# Owner, 26 Nov 2026: a one-off read of NSE's own four-level classification for S189's four stocks
# (CMPDI, SUDEEPPHRM, INA, BUILDPRO), whose Screener sector differs from the Nifty 1000 list's. Manual only,
# no schedule, writes nothing: the log is the reader. Remove once S189 is settled.

on:
  workflow_dispatch:
    inputs:
      symbols:
        description: NSE symbols, space separated
        default: CMPDI SUDEEPPHRM INA BUILDPRO

permissions:
  contents: read

jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install requests
      - name: Read NSE's classification
        env:
          SYMBOLS: ${{ inputs.symbols }}
        run: python scripts/nse_quote_industry.py $SYMBOLS
