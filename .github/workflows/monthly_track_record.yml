name: Monthly Track Record Freeze

on:
  schedule:
    # 19:00 UTC = 00:30 IST, on the 2nd through 5th of each month.
    #
    # It runs on FOUR days, not one, and that is deliberate. The job needs the
    # previous month's final session to be present in the price history, and
    # the 1st can fall on a weekend, a holiday, or a day the daily sync missed.
    # Re-running is free: finalize_months only ever ADDS months it has not
    # recorded, so the 3rd, 4th and 5th are no-ops once the 2nd has succeeded.
    # An append-only ledger is what makes a retry schedule safe.
    - cron: '0 19 2-5 * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Two of these writing data/track_record.json at once could interleave a read
  # and a write and drop a month. They are cheap and idempotent, so queue them.
  group: track-record
  cancel-in-progress: false

jobs:
  freeze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Freeze newly closed months
        run: python scripts/update_track_record.py

      - name: Commit the ledger
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/track_record.json
          if git diff --staged --quiet; then
            echo "No new closed months; ledger unchanged."
            exit 0
          fi
          git commit -m "chore(track-record): freeze closed month(s) [skip ci]"
          # Same rebase-and-retry as the daily sync: a plain push loses the
          # whole update if anything lands on main while this runs.
          for i in 1 2 3 4 5; do
            if git push; then
              echo "Pushed."
              exit 0
            fi
            echo "Push failed (attempt $i); rebasing onto origin/main."
            git fetch origin main
            git rebase origin/main || {
              # The ledger is append-only, so on a conflict OUR version is the
              # one carrying the new month. Keep it and continue.
              git checkout --ours -- data/track_record.json 2>/dev/null || true
              git add data/track_record.json
              git rebase --continue || git rebase --abort
            }
            sleep $((i * 5))
          done
          echo "::error::Could not push the track record after 5 attempts."
          exit 1
