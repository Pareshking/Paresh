name: Monthly Track Record Freeze

on:
  schedule:
    # 19:00 UTC = 00:30 IST, on the 1st through 5th of each month. The 1st is the first
    # try: NSE's closes for that day are on R2 by then, and a month closes the day
    # the first session of the next one is on file.
    #
    # It runs on FOUR days, not one, and that is deliberate. The job needs the
    # previous month's final session to be present in the price history, and
    # the 1st can fall on a weekend, a holiday, or a day the daily sync missed.
    # Re-running is free: finalize_months only ever ADDS months it has not
    # recorded, so the later days are no-ops once one has succeeded.
    # An append-only ledger is what makes a retry schedule safe.
    - cron: '0 19 1-5 * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Two of these writing data/track_record.json at once could interleave a read
  # and a write and drop a month. They are cheap and idempotent, so queue them.
  group: track-record
  cancel-in-progress: false

jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Seed the cache from the ARCHIVE, not the app snapshot. The app snapshot
      # carries only the screener's trailing window; the record needs every
      # month since inception plus a 12-month formation window before the
      # earliest one. Without this the freeze would run on a short frame and,
      # once the record outgrows that window, quietly stop producing months.
      - name: Seed price cache from the full archive
        run: |
          mkdir -p data_cache
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/data-latest/prices_full.parquet"
          if curl -fsSL "$URL" -o data_cache/prices.parquet; then
            ls -lh data_cache/prices.parquet
          else
            echo "::warning::Archive unavailable; the freeze will fetch from Yahoo instead."
            rm -f data_cache/prices.parquet
          fi

      # Stocks the index has dropped since still need prices: a month is scored
      # on the index as it stood, and a name that has just left must have a
      # price for its sale. A failure keeps the committed file, which is
      # stale only for names that left since the last run.
      - name: Refresh prices for former index members
        run: python scripts/sync_former_member_prices.py || echo "::warning::Former-member prices were NOT refreshed -- the committed file is used."

      # The 750's record is struck on NSE's closes as published (data/nse_prices).
      # The sessions since the last run are read from R2, where nse_collect.yml
      # already stores them; if R2 is unreadable the committed file is kept and the
      # freeze below refuses to record a month the file does not cover.
      - name: Verify the R2 read (last sessions against the committed file)
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python scripts/sync_nse_prices.py --verify-r2 || echo "::warning::R2 and the committed NSE file disagree, or R2 could not be read."

      - name: Rehearse the append (cut the last sessions, re-append them from R2, compare)
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python scripts/sync_nse_prices.py --rehearse-append || echo "::warning::The R2 append rehearsal did not match the committed file."

      - name: Extend NSE closes from R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python scripts/sync_nse_prices.py --update --source r2 || echo "::warning::NSE closes were NOT extended -- the committed file is used."

      - name: Freeze newly closed months
        run: python scripts/update_track_record.py

      # Nano Cap and Combined keep their own records from October 2026 (owner,
      # 2026-09-27), each on its own point-in-time membership. Their Nano Cap
      # stocks are priced from the extra universe's own Yahoo file. A failure
      # here never stops the 750's freeze above from being committed.
      - name: Freeze Nano Cap and Combined
        run: |
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/data-latest/prices_extra.parquet"
          curl -fsSL "$URL" -o prices_extra.parquet || echo "::warning::prices_extra unavailable; downloading from Yahoo."
          for SYSTEM in nano combined; do
            python scripts/update_track_record.py --system "$SYSTEM" --extra-prices prices_extra.parquet \
              || echo "::warning::$SYSTEM record freeze failed; the 750's record is unaffected."
          done

      - name: Commit the ledger
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/track_record*.json data/former_member_prices.parquet data/former_member_prices.json data/nse_prices
          if git diff --staged --quiet; then
            echo "No new closed months; ledger unchanged."
            exit 0
          fi
          git commit -m "chore(track-record): freeze closed month(s) [skip ci]"
          # Same rebase-and-retry as the daily sync: a plain push loses the
          # whole update if anything lands on main while this runs.
          for i in 1 2 3 4 5; do
            if git push; then
              echo "Pushed."
              exit 0
            fi
            echo "Push failed (attempt $i); rebasing onto origin/main."
            git fetch origin main
            git rebase origin/main || {
              # The ledger is append-only, so on a conflict this run's version
              # is the one carrying the new month. Keep it and continue. In a
              # rebase that is --theirs (--ours is origin/main).
              git checkout --theirs -- data/track_record*.json 2>/dev/null || true
              git add data/track_record*.json
              GIT_EDITOR=true git rebase --continue || git rebase --abort
            }
            sleep $((i * 5))
          done
          echo "::error::Could not push the track record after 5 attempts."
          exit 1
