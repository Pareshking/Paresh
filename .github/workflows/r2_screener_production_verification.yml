name: R2 production Screener verification

# A one-off acceptance of ONE Screener publication, identified by its SHA-256
# and as-of date. It used to also run on every push to this file with the
# 2026-09-21 values as defaults; the daily sync replaces the release asset
# every night, so from 2026-09-22 on that push run could only fail (red on
# 2026-09-25 at 02:00 and 09:09). Dispatch it by hand with the publication
# you mean to verify; there is no default, so it cannot check a stale one.
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: "Expected Screener release SHA-256"
        required: true
      expected_as_of:
        description: "Expected Screener archive as-of date (YYYY-MM-DD)"
        required: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      EXPECTED_AS_OF: ${{ inputs.expected_as_of }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      PYTHONPATH: .

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download production Screener release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/r2-production
          gh release download data-latest \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "screener_prices.parquet" \
            --dir /tmp/r2-production \
            --clobber
          test -s /tmp/r2-production/screener_prices.parquet

      - name: Verify release artifact identity
        run: |
          set -euo pipefail
          SHA="$(sha256sum /tmp/r2-production/screener_prices.parquet | awk '{print $1}')"
          echo "release_sha=$SHA"
          echo "expected_sha=$EXPECTED_SHA"
          test "$SHA" = "$EXPECTED_SHA"

          AS_OF="$(python - <<'PY'
          import pandas as pd
          frame = pd.read_parquet("/tmp/r2-production/screener_prices.parquet")
          print(pd.DatetimeIndex(frame.index).max().date())
          PY
          )"
          echo "release_as_of=$AS_OF"
          echo "expected_as_of=$EXPECTED_AS_OF"
          test "$AS_OF" = "$EXPECTED_AS_OF"

      - name: Live R2 manifest/current/object/HEAD/SHA verification
        run: |
          python scripts/r2_audit.py \
            --dataset prices/screener \
            --as-of "$EXPECTED_AS_OF"

      - name: Actual identical retry against the immutable publication
        run: |
          set -euo pipefail
          python scripts/r2_publish.py \
            --path /tmp/r2-production/screener_prices.parquet \
            --dataset prices/screener \
            --source screener \
            --key-root archive/prices/screener \
            --pipeline-version "r2-production-identical-retry" \
            --release-tag data-latest

      - name: Post-retry live R2 verification
        run: |
          python scripts/r2_audit.py \
            --dataset prices/screener \
            --as-of "$EXPECTED_AS_OF"

      - name: Write verification summary
        run: |
          {
            echo "## R2 production Screener verification"
            echo ""
            echo "- expected as-of: `$EXPECTED_AS_OF`"
            echo "- expected SHA-256: `$EXPECTED_SHA`"
            echo "- live manifest/current/object/HEAD/SHA verification: PASS"
            echo "- actual identical immutable retry: PASS"
            echo "- post-retry live verification: PASS"
          } >> "$GITHUB_STEP_SUMMARY"
