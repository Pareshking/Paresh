name: Apply V1 EMA duplicate-column fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch app.py
        shell: python
        run: |
          from pathlib import Path
          p = Path('app.py')
          s = p.read_text()

          old = '''total_stocks = len(rank_df)\nis_above_ema = (\n    rank_df["Above 50 EMA"].map(\n        lambda x: x is True or str(x).strip() in ["✅", "True", "1"]\n    )\n    if "Above 50 EMA" in rank_df.columns\n    else pd.Series(False, index=rank_df.index)\n)\nabove_ema = int(is_above_ema.sum())'''

          new = '''total_stocks = len(rank_df)\n\n# Defensive handling for duplicate column names.  A duplicate "Above 50 EMA"\n# can turn rank_df["Above 50 EMA"] into a DataFrame, causing int(sum()) to fail.\n# Keep the rightmost calculated value from MomentumEngine.get_rankings().\nema_col = rank_df.get("Above 50 EMA")\nif isinstance(ema_col, pd.DataFrame):\n    ema_col = ema_col.iloc[:, -1]\n\nis_above_ema = (\n    ema_col.map(\n        lambda x: x is True or str(x).strip() in ["✅", "True", "1"]\n    )\n    if ema_col is not None\n    else pd.Series(False, index=rank_df.index)\n)\nabove_ema = int(is_above_ema.sum())'''

          if old not in s:
              raise SystemExit('Expected EMA KPI block not found; refusing unsafe patch')
          s = s.replace(old, new, 1)
          p.write_text(s)

      - name: Syntax check
        run: python -m py_compile app.py

      - name: Commit fix and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py
          git rm .github/workflows/v1-ema-duplicate-fix.yml
          git commit -m 'Fix V1 EMA KPI duplicate-column handling'
          git push origin main
