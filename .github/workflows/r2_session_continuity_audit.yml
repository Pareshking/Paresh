name: R2 session continuity audit

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"
  push:
    branches: [main]
    paths:
      - "scripts/r2_session_continuity_audit.py"
      - "tests/test_r2_session_continuity_audit.py"
      - ".github/workflows/r2_session_continuity_audit.yml"

permissions:
  contents: read

# Never let two runs of this workflow write the same objects at once.
concurrency:
  group: r2-publish-r2_session_continuity_audit
  cancel-in-progress: false

jobs:
  continuity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Unit tests
        run: python -m pytest -q tests/test_r2_session_continuity_audit.py
      - name: Build observed sessions from canonical release
        run: |
          gh release download data-latest --pattern screener_prices.parquet --dir /tmp/r2
          python scripts/build_trading_sessions.py \
            --prices /tmp/r2/screener_prices.parquet \
            --output /tmp/observed_sessions.parquet
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Audit observed session continuity
        run: python scripts/r2_session_continuity_audit.py --dataset /tmp/observed_sessions.parquet --json
