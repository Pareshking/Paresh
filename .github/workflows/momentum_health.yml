name: Momentum health (monthly)

# S91 (owner, 7 Nov 2026: "build it"). A Dashboard panel reads data/momentum_health.csv;
# this job writes it and checks it before committing. A failure keeps the
# committed file and lands on the scheduled-failure alert.
on:
  schedule:
    - cron: '23 6 2-6 * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: momentum_health
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Build and check
        env:
          PYTHONPATH: .
        run: python scripts/build_momentum_health.py
      - name: Commit
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/momentum_health.csv data/momentum_health_latest.json
          if git diff --staged --quiet; then
            echo "Unchanged."
            exit 0
          fi
          git commit -m "chore(data): momentum health [skip ci]"
          for i in 1 2 3 4 5; do
            if git push; then echo "Pushed."; exit 0; fi
            echo "Push failed (attempt $i); rebasing onto origin/main."
            git fetch origin main
            git rebase origin/main || { git rebase --abort; exit 1; }
            sleep $((i * 5))
          done
          exit 1
