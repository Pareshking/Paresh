name: R2 Final Acceptance

on:
  workflow_dispatch:
    inputs:
      research_dataset:
        description: "Immutable R2 dataset"
        required: true
        default: "market_caps/nse_history"
      research_as_of:
        description: "Immutable R2 evidence date"
        required: true
        default: "2026-09-18"
      research_revision:
        description: "64-character immutable revision SHA"
        required: true
        default: "f01555ee9afa74a0f6c0c8bd5e8e451b88bd7390c79ca8367cf0ff904244b6e6"
  # No schedule (audit A3, 7 Nov 2026): the acceptance of the 22 Sep R2 evidence is
  # done (docs/R2_ENGINEERING_LOOP.md, "R2 acceptance is complete"). Weekly, it re-proved
  # the same fixed date and timed out at 20 minutes on every run since 5 Oct, because its
  # recovery step reads the whole bucket; r2_recovery_audit.yml runs that check weekly.
  # Run it by hand to re-prove the acceptance.

permissions:
  contents: read

# Never let two runs of this workflow write the same objects at once.
concurrency:
  group: r2-publish-r2_final_acceptance
  cancel-in-progress: false

jobs:
  final:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - run: pip install -r requirements.txt pytest
      - name: R2 regression
        run: python -m pytest -q tests/test_r2_*.py tests/test_build_trading_sessions.py tests/test_market_cap_history.py
      - name: Live PIT membership acceptance
        run: python scripts/r2_membership_live_validation.py --as-of "2026-09-18"
      - name: Live immutable research acceptance
        env:
          IN_DATASET: ${{ inputs.research_dataset || 'market_caps/nse_history' }}
          IN_AS_OF: ${{ inputs.research_as_of || '2026-09-18' }}
          IN_REVISION: ${{ inputs.research_revision || 'f01555ee9afa74a0f6c0c8bd5e8e451b88bd7390c79ca8367cf0ff904244b6e6' }}
        run: |
          python scripts/r2_research_live_validation.py --dataset "$IN_DATASET" --as-of "$IN_AS_OF" --revision "$IN_REVISION"
      - name: Live recovery audit
        run: python scripts/r2_recovery_audit.py
      - name: Live cost observability
        run: python scripts/r2_cost_audit.py
