name: Repair production runtime

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message != 'Repair production price-history guard'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch empty holiday cleanup guard
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/engine/momentum.py')
          s = p.read_text()
          old = '''    if n_dropped > 0:\n        logger.debug(f"Holiday cleanup: dropped {n_dropped} rows")\n    # Remove exchange-wide missing dates only; preserve stock-specific NaNs.\n    cleaned = df.loc[~holidays]\n    return cleaned\n'''
          new = '''    if n_dropped > 0:\n        logger.debug(f"Holiday cleanup: dropped {n_dropped} rows")\n    if n_dropped == len(df):\n        logger.warning(\n            "Holiday cleanup would remove the entire dataset; preserving rows "\n            "to avoid converting an upstream sparse/malformed cache into an empty "\n            "production price history."\n        )\n        return df.copy()\n    # Remove exchange-wide missing dates only; preserve stock-specific NaNs.\n    return df.loc[~holidays]\n'''
          if old not in s:
              raise SystemExit('Expected clean_holidays block not found')
          p.write_text(s.replace(old, new, 1))
          PY
          rm .github/workflows/repair-production-runtime.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/engine/momentum.py .github/workflows/repair-production-runtime.yml
          git commit -m 'Repair production price-history guard'
          git push origin main
