name: FII and DII flows (daily)

# S91 (owner, 7 Nov 2026: "build it"). A Dashboard panel reads data/fii_dii_flows.csv;
# this job writes it and checks it before committing. A failure keeps the
# committed file and lands on the scheduled-failure alert.
on:
  schedule:
    - cron: '47 14 * * 1-5'
    - cron: '47 17 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fii_dii
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Build and check
        env:
          PYTHONPATH: .
        run: python scripts/collect_fii_dii.py
      # Owner, 8 Nov: one day's flow is misleading; the panel needs history.
      # NSE and MSEI publish only the latest day. NSDL's FPI reports go back
      # years but refused the Claude session that built this; record whether
      # GitHub's runner reaches them (never fails the job).
      - name: Can this runner reach NSDL's FPI reports?
        continue-on-error: true
        run: |
          for u in https://www.fpi.nsdl.co.in/web/Reports/Latest.aspx https://www.fpi.nsdl.co.in/web/Reports/Archive.aspx; do
            code=$(curl -sS -m 30 -A 'Mozilla/5.0' -o /tmp/nsdl.html -w '%{http_code} %{size_download}' "$u" 2>&1 || true)
            echo "NSDL $u -> $code"
            grep -o '<title>[^<]*' /tmp/nsdl.html 2>/dev/null | head -1 || true
          done
      - name: Commit
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/fii_dii_flows.csv
          if git diff --staged --quiet; then
            echo "Unchanged."
            exit 0
          fi
          git commit -m "chore(data): FII/DII flows [skip ci]"
          for i in 1 2 3 4 5; do
            if git push; then echo "Pushed."; exit 0; fi
            echo "Push failed (attempt $i); rebasing onto origin/main."
            git fetch origin main
            git rebase origin/main || { git rebase --abort; exit 1; }
            sleep $((i * 5))
          done
          exit 1
