name: NSE long price file (backtests from 2010)

# Builds the long NSE price file the Backtest page's "History from 2010" mode
# runs on: R2's NSE bhavcopy, 2008 to date, adjusted for splits, bonuses,
# consolidations and demergers, renames joined; every stock any index ever
# listed; traded value alongside. Read only on R2; the three files go to the
# data-latest release (src/loaders/nse_long.py reads them). NSE-only gaps are
# filled from BSE's raw closes (bse_daily.parquet on the release, refreshed by
# bse_daily.yml; src/loaders/bse_fill.py, TODO S38) before any adjustment.
# See scripts/build_nse_long_prices.py.
on:
  schedule:
    # Saturdays 03:30 UTC: the week's sessions are on R2 (nse_collect, every 4 h).
    - cron: '30 3 * * 6'
  workflow_dispatch:
    inputs:
      since:
        description: "First session to read (YYYY-MM-DD)"
        default: "2008-01-01"
      full:
        description: "Read every session from R2 again, not only those the raw pack lacks (yes/no)"
        default: "no"

permissions:
  contents: write

concurrency:
  group: nse-long-prices
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONPATH: .
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - run: pip install -r requirements.txt
      # The raw-history pack: every row the last build read, so only newer
      # sessions come from R2 (a full read is ~4,700 requests, ~35 minutes).
      - name: The raw-history pack from the last build
        if: inputs.full != 'yes'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p pack
          gh release download data-latest --repo "$GITHUB_REPOSITORY" --pattern nse_raw_pack.parquet --dir pack \
            || echo "No pack yet: every session is read from R2."
          ls -lh pack
      # BSE's table (bse_daily.yml): NSE-only gaps are filled from it. Without it
      # the build still runs, fills nothing, and says so in the report.
      - name: BSE's daily table
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p bse
          gh release download data-latest --repo "$GITHUB_REPOSITORY" --pattern bse_daily.parquet --dir bse \
            || echo "::warning::no bse_daily.parquet on the release: NSE-only gaps stay empty this build"
          ls -lh bse
      - name: Build
        run: |
          # A missing pack (first run, or full=yes) reads every session.
          python scripts/build_nse_long_prices.py --since "${{ inputs.since || '2008-01-01' }}" --out data_cache/nse_long --pack pack/nse_raw_pack.parquet --bse bse/bse_daily.parquet
          ls -lh data_cache/nse_long
          {
            echo "## NSE long price file"
            echo '```json'
            python -c "import json; r=json.load(open('data_cache/nse_long/nse_long_report.json')); r['unpriced']=r['unpriced'][:40]; print(json.dumps(r, indent=1))"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      # Never replace the published file with a smaller one (owner, 2026-10-07):
      # a dispatch with a later "since", or sessions R2 failed to serve, stops here.
      - name: Check the new file is no smaller than the published one
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ inputs.since || '2008-01-01' }}" != "2008-01-01" ]; then
            echo "::error::since=${{ inputs.since }}: only a build from 2008-01-01 may replace the published file"
            exit 1
          fi
          mkdir -p published
          gh release download data-latest --repo "$GITHUB_REPOSITORY" --dir published             --pattern nse_long_close.parquet || echo "No published close file yet."
          [ -f pack/nse_raw_pack.parquet ] && cp pack/nse_raw_pack.parquet published/ ||             gh release download data-latest --repo "$GITHUB_REPOSITORY" --dir published               --pattern nse_raw_pack.parquet || echo "No published pack yet."
          python scripts/check_long_publish.py --new data_cache/nse_long --old published
      - name: Publish to the data-latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view data-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create data-latest \
              --repo "$GITHUB_REPOSITORY" \
              --title "Latest data snapshots" \
              --notes "Rolling history published by the sync jobs." \
              --latest=false
          gh release upload data-latest \
            data_cache/nse_long/nse_long_close.parquet \
            data_cache/nse_long/nse_long_value.parquet \
            data_cache/nse_long/nse_long_report.json \
            data_cache/nse_long/nse_raw_pack.parquet \
            --repo "$GITHUB_REPOSITORY" --clobber
      # The audits (docs/PRICE_PIPELINE.md, "Audit"): the new file against every
      # reference on the release, against Screener point by point, and NSE's raw
      # rows' own arithmetic, dividends, ISINs and calendar. They run here, after
      # each build, so no laptop has to be on; a failure never blocks the publish.
      - name: Audit the new file
        id: audit
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p refs audit
          gh release download data-latest --repo "$GITHUB_REPOSITORY" --dir refs             --pattern 'ref_*_close*.parquet' --pattern screener_max_history.parquet             --pattern ref_nse_action_list_api_2008_2026.zip
          unzip -q -o -j refs/ref_nse_action_list_api_2008_2026.zip -d refs/actions
          python scripts/audit_long_prices.py --ours data_cache/nse_long/nse_long_close.parquet             --ref yahoo=refs/ref_yahoo_close.parquet --ref eod2=refs/ref_eod2_close.parquet             --ref tijori=refs/ref_tijori_close_verified.parquet --ref ss=refs/ref_ss_close.parquet             --ref marketlens=refs/ref_marketlens_close.parquet --ref tejhq=refs/ref_tejhq_adjusted_close.parquet             --no-confirm marketlens --no-confirm tejhq --out audit
          python scripts/audit_against_screener.py --ours data_cache/nse_long/nse_long_close.parquet             --screener refs/screener_max_history.parquet --out audit
          python scripts/audit_raw_bars.py --pack data_cache/nse_long/nse_raw_pack.parquet --ours data_cache/nse_long/nse_long_close.parquet             --actions refs/actions --out audit
          # The days taken from BSE: every cell, every gap's verdict, and their
          # agreement with the independent references (scripts/verify_bse_fill.py).
          cp data_cache/nse_long/bse_fill_cells.csv data_cache/nse_long/bse_fill_gaps.csv audit/
          python scripts/verify_bse_fill.py --long data_cache/nse_long/nse_long_close.parquet             --cells data_cache/nse_long/bse_fill_cells.csv --report data_cache/nse_long/nse_long_report.json             --ref tijori=refs/ref_tijori_close_verified.parquet --ref eod2=refs/ref_eod2_close.parquet             --ref ss=refs/ref_ss_close.parquet --ref yahoo=refs/ref_yahoo_close.parquet             --ref screener=refs/screener_max_history.parquet --out audit
          (cd audit && zip -q ../long_price_audit_latest.zip ./*)
          gh release upload data-latest long_price_audit_latest.zip --repo "$GITHUB_REPOSITORY" --clobber
          {
            echo "## Audit"
            for f in summary.json screener_summary.json raw_summary.json bse_fill_verify.json; do
              echo "### $f"; echo '```json'; cat "audit/$f"; echo '```'
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: nse-long-prices
          path: |
            data_cache/nse_long/
            !data_cache/nse_long/nse_raw_pack.parquet
            audit/
          if-no-files-found: ignore
          retention-days: 14
