name: V1 Audit Hardening

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt pytest
      - name: Apply deterministic audit hardening
        run: python scripts/harden_v1.py
      - name: Run full regression suite
        run: python -m pytest -q
      - name: Compile audited modules
        run: python -m py_compile src/engine/calendar_momentum.py src/engine/backtester.py src/engine/momentum.py src/engine/portfolio.py
      - name: Commit verified hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/engine/calendar_momentum.py src/engine/backtester.py src/engine/momentum.py src/engine/portfolio.py src/ui/views/ranking_view.py src/ui/views/backtest_view.py README.md src/ui/views/guide_view.py scripts/harden_v1.py
          git diff --cached --quiet && exit 0
          git commit -m "fix(v1): harden audit methodology consistency"
          git push
