[theme]
# "Paper B · Ledger", white ground (owner, 7 Nov 2026): ink on white, IBM Plex
# Sans and Mono, blue for up and rust for down, thin rules instead of boxes.
# The same tokens are repeated as CSS variables in src/ui/theme.py.
base = "light"
primaryColor = "#1C1B19"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F7F7F5"
textColor = "#1C1B19"
linkColor = "#1C1B19"
linkUnderline = true
borderColor = "#D6D6D2"
showWidgetBorder = true
baseRadius = "4px"
greenColor = "#1D5FA6"
redColor = "#A4441A"
orangeColor = "#B54708"
dataframeHeaderBackgroundColor = "#F7F7F5"
# Names only: the faces are self-hosted in static/fonts.css (audit F61), loaded
# by the app's own CSS; a Google URL here made the page ask Google as well.
font = "'IBM Plex Sans', sans-serif"
headingFont = "'IBM Plex Sans', sans-serif"
codeFont = "'IBM Plex Mono', monospace"

# The faces themselves, declared to Streamlit so it writes their @font-face
# rules when the page opens, before the script has sent anything (19 Nov 2026:
# they arrived with the first element, after the script's first seconds).
# Streamlit writes rules only for families named above, so Source Serif 4 is
# declared by the page's first style block instead (tokens.serif_face_css).
# Mirrors static/fonts.css, which the chart and table frames still link;
# tests/test_self_hosted_fonts.py fails if the two drift apart.
[[theme.fontFaces]]
family = "IBM Plex Mono"
url = "app/static/fonts/ibm-plex-mono-400-latin-ext.woff2"
weight = "400"
unicodeRange = "U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF"

[[theme.fontFaces]]
family = "IBM Plex Mono"
url = "app/static/fonts/ibm-plex-mono-400-latin.woff2"
weight = "400"
unicodeRange = "U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD"

